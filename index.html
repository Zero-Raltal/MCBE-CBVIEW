    function mcwBuildLogRecord(data,type){
        if(type===undefined)type=1;
        const header=new Uint8Array(7);
        const dv=new DataView(header.buffer);
        dv.setUint16(4,data.length,true);
        header[6]=type;
        const crcRange=new Uint8Array(1+data.length);
        crcRange[0]=type;crcRange.set(data,1);
        dv.setUint32(0,mcwMaskedCRC32C(crcRange),true);
        const result=new Uint8Array(7+data.length);
        result.set(header);result.set(data,7);
        return result;
    }

    function mcwBuildSSTable(entries){
        const sorted=[...entries].sort((a,b)=>{
            const n=Math.min(a.key.length,b.key.length);
            for(let i=0;i<n;i++)if(a.key[i]!==b.key[i])return a.key[i]-b.key[i];
            return a.key.length-b.key.length;
        });
        function makeInternalKey(userKey){
            const ik=new Uint8Array(userKey.length+8);
            ik.set(userKey,0);
            ik[userKey.length]=1;
            return ik;
        }
        function blockWithTrailer(blockBytes){
            const crcInput=new Uint8Array(blockBytes.length+1);
            crcInput.set(blockBytes,0);
            crcInput[blockBytes.length]=0;
            const crc=mcwMaskedCRC32C(crcInput);
            const result=new Uint8Array(blockBytes.length+5);
            result.set(blockBytes,0);
            result[blockBytes.length]=0;
            result[blockBytes.length+1]=crc&0xFF;
            result[blockBytes.length+2]=(crc>>>8)&0xFF;
            result[blockBytes.length+3]=(crc>>>16)&0xFF;
            result[blockBytes.length+4]=(crc>>>24)&0xFF;
            return result;
        }
        function encodeHandle(offset,size){
            const buf=[];
            mcwWriteVarInt(buf,offset);
            mcwWriteVarInt(buf,size);
            return new Uint8Array(buf);
        }
        function buildBlock(blockEntries){
            const blockData=[];
            const restarts=[];
            for(const {key,value} of blockEntries){
                restarts.push(blockData.length);
                mcwWriteVarInt(blockData,0);
                mcwWriteVarInt(blockData,key.length);
                mcwWriteVarInt(blockData,value.length);
                for(let i=0;i<key.length;i++)blockData.push(key[i]);
                for(let i=0;i<value.length;i++)blockData.push(value[i]);
            }
            for(const r of restarts)blockData.push(r&0xFF,(r>>>8)&0xFF,(r>>>16)&0xFF,(r>>>24)&0xFF);
            blockData.push(restarts.length&0xFF,(restarts.length>>>8)&0xFF,(restarts.length>>>16)&0xFF,(restarts.length>>>24)&0xFF);
            return new Uint8Array(blockData);
        }
        const BLOCK_TARGET=4096;
        const groups=[];let current=[];let currentSize=0;
        for(const entry of sorted){
            const ik=makeInternalKey(entry.key);
            const est=15+ik.length+entry.value.length;
            if(currentSize+est>BLOCK_TARGET&&current.length>0){
                groups.push(current);current=[];currentSize=0;
            }
            current.push({key:ik,value:entry.value});
            currentSize+=est;
        }
        if(current.length>0)groups.push(current);
        const dataBlocks=[];
        for(const group of groups){
            dataBlocks.push({bytes:buildBlock(group),lastKey:group[group.length-1].key});
        }
        const dataBlockOffsets=[];
        let offset=0;
        for(const b of dataBlocks){dataBlockOffsets.push(offset);offset+=b.bytes.length+5;}
        const metaIndexBlockBytes=buildBlock([]);
        const metaIndexBlockWithTrailer=blockWithTrailer(metaIndexBlockBytes);
        const indexEntries=[];
        for(let i=0;i<dataBlocks.length;i++){
            const handle=encodeHandle(dataBlockOffsets[i],dataBlocks[i].bytes.length);
            indexEntries.push({key:dataBlocks[i].lastKey,value:handle});
        }
        const indexBlockBytes=buildBlock(indexEntries);
        const indexBlockWithTrailer=blockWithTrailer(indexBlockBytes);
        const metaIndexBlockOffset=offset;
        const indexBlockOffset=metaIndexBlockOffset+metaIndexBlockWithTrailer.length;
        const footerBuf=[];
        mcwWriteVarInt(footerBuf,metaIndexBlockOffset);
        mcwWriteVarInt(footerBuf,metaIndexBlockBytes.length);
        mcwWriteVarInt(footerBuf,indexBlockOffset);
        mcwWriteVarInt(footerBuf,indexBlockBytes.length);
        while(footerBuf.length<40)footerBuf.push(0);
        footerBuf.push(0x57,0xfb,0x80,0x8b,0x24,0x75,0x47,0xdb);
        const pieces=[];
        for(const b of dataBlocks)pieces.push(blockWithTrailer(b.bytes));
        pieces.push(metaIndexBlockWithTrailer);
        pieces.push(indexBlockWithTrailer);
        pieces.push(new Uint8Array(footerBuf));
        let totalLen=0;
        for(const p of pieces)totalLen+=p.length;
        const result=new Uint8Array(totalLen);
        let off=0;
        for(const p of pieces){result.set(p,off);off+=p.length;}
        return result;
    }

    function mcwBuildManifestWithLdb(logNumber,fileNumber,fileSize,smallestKey,largestKey){
        const m=[];
        mcwWriteVarInt(m,1);
        const cmp='leveldb.BytewiseComparator';
        mcwWriteVarInt(m,cmp.length);
        for(let i=0;i<cmp.length;i++)m.push(cmp.charCodeAt(i));
        mcwWriteVarInt(m,2);
        mcwWriteVarInt(m,logNumber);
        mcwWriteVarInt(m,7);
        mcwWriteVarInt(m,0);
        mcwWriteVarInt(m,fileNumber);
        mcwWriteVarInt(m,fileSize);
        mcwWriteVarInt(m,smallestKey.length);
        for(let i=0;i<smallestKey.length;i++)m.push(smallestKey[i]);
        mcwWriteVarInt(m,largestKey.length);
        for(let i=0;i<largestKey.length;i++)m.push(largestKey[i]);
        mcwWriteVarInt(m,6);
        mcwWriteVarInt(m,2);
        mcwWriteVarInt(m,3);
        mcwWriteVarInt(m,fileNumber+1);
        return mcwBuildLogRecord(new Uint8Array(m),1);
    }

    // 脉冲（归零，红石）→ 循环（自增，红石）→ 连锁（逐帧，自动）
    function buildMcWorldCmdEntries(){
        const entries=[];
        const prefix=getLinePrefix();
        if(currentMode==='image'&&imageData){
            entries.push({type:'repeat',cmd:imageData.singleCmd,tickDelay:0,auto:0});
        }else if(currentMode==='video'&&videoFrameData){
            const allCharArts=videoFrameData.allCharArts;
            let delay=parseInt(delayInput.value);
            if(isNaN(delay)||delay<1)delay=1;
            if(delay>20)delay=20;
            const mode=cmdModeSelect.value;

            entries.push({
                type:'pulse',
                cmd:'scoreboard players set f f 0',
                tickDelay:0,
                auto:0
            });
            entries.push({
                type:'repeat',
                cmd:'scoreboard players add f f 1',
                tickDelay:delay-1,
                auto:0
            });
            for(let i=0;i<allCharArts.length;i++){
                if(!allCharArts[i])continue;
                const singleCmd=buildSingleCommand(allCharArts[i],mode,prefix);
                entries.push({
                    type:'chain',
                    cmd:`execute if score f f matches ${i+1} run ${singleCmd}`,
                    tickDelay:0,
                    auto:1
                });
            }
        }
        return entries;
    }

    async function exportMcWorld(){
        const cmdEntries=buildMcWorldCmdEntries();
        if(cmdEntries.length===0){
            alert('请先转换图片或视频，再导出存档。');
            return;
        }
        const fileBaseName=(fileInput.files[0]&&fileInput.files[0].name.replace(/\.[^.]+$/,''))||'CharacterArt';
        const worldName=fileBaseName||'CharacterArt';
        const now=new Date();
        const pad=(n)=>String(n).padStart(2,'0');
        const dateStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
        const timeStr=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const signText=`§l§d@ZeroRaltal\n§b导出时间:\n§r§o§7${dateStr}\n${timeStr}`;

        const START_Y=-60;
        const LAYER_W=16,LAYER_D=16;
        const PER_LAYER=LAYER_W*LAYER_D;
        const total=cmdEntries.length;
        const layers=Math.ceil(total/PER_LAYER);
        const MAX_WORLD_Y=319;
        const maxWorldY=START_Y+layers-1;
        if(maxWorldY>MAX_WORLD_Y){
            alert(`命令方块过多（${total} 个，${layers} 层）\n最高方块到达 Y=${maxWorldY}，超过世界高度上限 Y=${MAX_WORLD_Y}。\n\n请减少帧数、降低 FPS 或降低分辨率后重试。`);
            return;
        }
        function posOf(idx){
            const layer=Math.floor(idx/PER_LAYER);
            const within=idx%PER_LAYER;
            const row=Math.floor(within/LAYER_W);
            const col=within%LAYER_W;
            const reverse=(layer%2===1);
            let z,x;
            if(!reverse){z=row;x=(row%2===0)?col:(LAYER_W-1-col);}
            else{z=LAYER_D-1-row;x=(row%2===0)?col:(LAYER_W-1-col);}
            return {x,y:layer,z};
        }
        function facingOf(a,b){
            if(b.y>a.y)return 1;
            if(b.y<a.y)return 0;
            if(b.x>a.x)return 5;
            if(b.x<a.x)return 4;
            if(b.z>a.z)return 3;
            if(b.z<a.z)return 2;
            return 1;
        }
        const cmdBlocks=[];
        for(let i=0;i<total;i++){
            const p=posOf(i);
            const within=i%PER_LAYER;
            const isLastOfLayer=(within===PER_LAYER-1);
            let facing;
            if(i===total-1){facing=(i===0)?1:facingOf(posOf(i-1),posOf(i));}
            else if(isLastOfLayer){facing=1;}
            else facing=facingOf(p,posOf(i+1));
            const e=cmdEntries[i];
            let blockName;
            if(e.type==='pulse')blockName='minecraft:command_block';
            else if(e.type==='repeat')blockName='minecraft:repeating_command_block';
            else blockName='minecraft:chain_command_block';
            cmdBlocks.push({
                worldX:p.x,worldY:START_Y+p.y,worldZ:p.z,
                blockName,facing,
                cmd:e.cmd,
                auto:e.auto?1:0,
                tickDelay:e.tickDelay||0
            });
        }
        const subChunkMap=new Map();
        for(const b of cmdBlocks){
            const subY=Math.floor(b.worldY/16);
            if(!subChunkMap.has(subY))subChunkMap.set(subY,[]);
            subChunkMap.get(subY).push(b);
        }
        const subChunkYs=Array.from(subChunkMap.keys()).sort((a,b)=>a-b);
        const subChunkDataList=[];
        for(const subY of subChunkYs){
            const blocksInSubChunk=subChunkMap.get(subY);
            const palette=[];
            const paletteKeys=new Map();
            function addLocal(name,states,version){
                const v=version||17825808;
                const key=name+'|'+JSON.stringify(states)+'|'+v;
                if(paletteKeys.has(key))return paletteKeys.get(key);
                palette.push(bSerializeBE([
                    {name:'name',type:8,value:name},
                    {name:'states',type:10,value:states},
                    {name:'version',type:3,value:v}
                ]));
                const idx=palette.length-1;
                paletteKeys.set(key,idx);
                return idx;
            }
            addLocal('minecraft:air',[]);
            const blocks=[];
            const includeGround=(subY===Math.floor(START_Y/16));
            if(includeGround){
                const BEDROCK_IDX=addLocal('minecraft:bedrock',[{name:'infiniburn_bit',type:3,value:0}]);
                const DIRT_IDX=addLocal('minecraft:dirt',[]);
                const GRASS_IDX=addLocal('minecraft:grass_block',[]);
                for(let x=0;x<16;x++){
                    for(let z=0;z<16;z++){
                        blocks.push({x,y:0,z,paletteIdx:BEDROCK_IDX});
                        blocks.push({x,y:1,z,paletteIdx:DIRT_IDX});
                        blocks.push({x,y:2,z,paletteIdx:DIRT_IDX});
                        blocks.push({x,y:3,z,paletteIdx:GRASS_IDX});
                    }
                }
            }
            for(const b of blocksInSubChunk){
                const idx=addLocal(b.blockName,[
                    {name:'facing_direction',type:3,value:b.facing},
                    {name:'conditional_bit',type:1,value:0}
                ]);
                const localY=b.worldY-subY*16;
                blocks.push({x:b.worldX,y:localY,z:b.worldZ,paletteIdx:idx});
            }
            const subChunkBytes=mcwBuildSubChunk(palette,blocks,subY);
            const nbtList=[];
            for(const b of blocksInSubChunk){
                nbtList.push(mcwBuildCommandBlockNbt(b.cmd,b.worldX,b.worldY,b.worldZ,b.auto,b.tickDelay));
            }
            let totalNbtLen=0;
            for(const n of nbtList)totalNbtLen+=n.length;
            const combinedNbt=new Uint8Array(totalNbtLen);
            let nbtOff=0;
            for(const n of nbtList){combinedNbt.set(n,nbtOff);nbtOff+=n.length;}
            subChunkDataList.push({
                subY,
                bytes:subChunkBytes.bytes,
                nbt:combinedNbt,
                blockCount:blocksInSubChunk.length,
                includeGround
            });
        }

        // 区块 (-1,0)：草地 + 拉杆 + 告示牌
        const m1_0_palette=[];
        const m1_0_paletteKeys=new Map();
        function addM10(name,states,version){
            const v=version||17825808;
            const key=name+'|'+JSON.stringify(states)+'|'+v;
            if(m1_0_paletteKeys.has(key))return m1_0_paletteKeys.get(key);
            m1_0_palette.push(bSerializeBE([
                {name:'name',type:8,value:name},
                {name:'states',type:10,value:states},
                {name:'version',type:3,value:v}
            ]));
            const idx=m1_0_palette.length-1;
            m1_0_paletteKeys.set(key,idx);
            return idx;
        }
        addM10('minecraft:air',[]);
        const BEDROCK_IDX_M10=addM10('minecraft:bedrock',[{name:'infiniburn_bit',type:3,value:0}]);
        const DIRT_IDX_M10=addM10('minecraft:dirt',[]);
        const GRASS_IDX_M10=addM10('minecraft:grass_block',[]);
        const m1_0_blocks=[];
        for(let x=0;x<16;x++){
            for(let z=0;z<16;z++){
                m1_0_blocks.push({x,y:0,z,paletteIdx:BEDROCK_IDX_M10});
                m1_0_blocks.push({x,y:1,z,paletteIdx:DIRT_IDX_M10});
                m1_0_blocks.push({x,y:2,z,paletteIdx:DIRT_IDX_M10});
                m1_0_blocks.push({x,y:3,z,paletteIdx:GRASS_IDX_M10});
            }
        }
        const LEVER_IDX=addM10('minecraft:lever',[
            {name:'facing_direction',type:3,value:4},
            {name:'open_bit',type:1,value:0},
            {name:'lever_direction',type:8,value:'west'}
        ]);
        m1_0_blocks.push({x:15,y:4,z:0,paletteIdx:LEVER_IDX});
        const SIGN_IDX=addM10('minecraft:standing_sign',[{name:'ground_sign_direction',type:3,value:4}],18168865);
        m1_0_blocks.push({x:15,y:4,z:1,paletteIdx:SIGN_IDX});
        const m1_0_subChunk=mcwBuildSubChunk(m1_0_palette,m1_0_blocks,-4);
        const m1_0_nbt=mcwBuildSignBlockEntityNbt(signText,-1,-60,1);

        function makeKey(chunkX,chunkZ,tag,subY){
            const len=subY!==undefined?10:9;
            const k=new Uint8Array(len);
            const dv=new DataView(k.buffer);
            dv.setInt32(0,chunkX,true);
            dv.setInt32(4,chunkZ,true);
            k[8]=tag;
            if(subY!==undefined)k[9]=subY&0xFF;
            return k;
        }

        const entries=[];
        const v2b=new Uint8Array(540);
        for(let i=0;i<270;i++)v2b[i*2]=0x04;
        const tag2c=new Uint8Array([0x2a]);
        const tag36=new Uint8Array([2,0,0,0]);
        const tag3f=new Uint8Array([0xb5,0x60,0x75,0xfd,0x69,0x2a,0x3c,0x93]);
        const tag40=new Uint8Array([0x00,0x0a]);
        const tag41=new Uint8Array([0x00]);
        const tag77=new Uint8Array(0);
        let allNbt_0_0=0;
        for(const sc of subChunkDataList)allNbt_0_0+=sc.nbt.length;
        const combinedNbt_0_0=new Uint8Array(allNbt_0_0);
        let off_0_0=0;
        for(const sc of subChunkDataList){combinedNbt_0_0.set(sc.nbt,off_0_0);off_0_0+=sc.nbt.length;}
        entries.push({key:makeKey(0,0,0x2b),value:v2b});
        entries.push({key:makeKey(0,0,0x2c),value:tag2c});
        for(const sc of subChunkDataList)entries.push({key:makeKey(0,0,0x2f,sc.subY&0xFF),value:sc.bytes});
        entries.push({key:makeKey(0,0,0x31),value:combinedNbt_0_0});
        entries.push({key:makeKey(0,0,0x36),value:tag36});
        entries.push({key:makeKey(0,0,0x3f),value:tag3f});
        entries.push({key:makeKey(0,0,0x40),value:tag40});
        entries.push({key:makeKey(0,0,0x41),value:tag41});
        entries.push({key:makeKey(0,0,0x77),value:tag77});
        entries.push({key:makeKey(-1,0,0x2b),value:v2b});
        entries.push({key:makeKey(-1,0,0x2c),value:tag2c});
        entries.push({key:makeKey(-1,0,0x2f,0xFC),value:m1_0_subChunk.bytes});
        entries.push({key:makeKey(-1,0,0x31),value:m1_0_nbt});
        entries.push({key:makeKey(-1,0,0x36),value:tag36});
        entries.push({key:makeKey(-1,0,0x3f),value:tag3f});
        entries.push({key:makeKey(-1,0,0x40),value:tag40});
        entries.push({key:makeKey(-1,0,0x41),value:tag41});
        entries.push({key:makeKey(-1,0,0x77),value:tag77});

        // 计分板：目标名 "f"
        const scoreboardBytes=new Uint8Array([
            0x0a, 0x00, 0x00,
            0x09, 0x08, 0x00, 0x43, 0x72, 0x69, 0x74, 0x65, 0x72, 0x69, 0x61,
            0x00, 0x00, 0x00, 0x00, 0x00,
            0x09, 0x11, 0x00, 0x44, 0x69, 0x73, 0x70, 0x6c, 0x61, 0x79, 0x4f, 0x62, 0x6a, 0x65, 0x63, 0x74, 0x69, 0x76, 0x65, 0x73,
            0x00, 0x00, 0x00, 0x00, 0x00,
            0x09, 0x07, 0x00, 0x45, 0x6e, 0x74, 0x72, 0x69, 0x65, 0x73,
            0x00, 0x00, 0x00, 0x00, 0x00,
            0x04, 0x0c, 0x00, 0x4c, 0x61, 0x73, 0x74, 0x55, 0x6e, 0x69, 0x71, 0x75, 0x65, 0x49, 0x44,
            0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
            0x09, 0x0a, 0x00, 0x4f, 0x62, 0x6a, 0x65, 0x63, 0x74, 0x69, 0x76, 0x65, 0x73,
            0x0a, 0x01, 0x00, 0x00, 0x00,
            0x08, 0x08, 0x00, 0x43, 0x72, 0x69, 0x74, 0x65, 0x72, 0x69, 0x61,
            0x05, 0x00, 0x64, 0x75, 0x6d, 0x6d, 0x79,
            0x08, 0x0b, 0x00, 0x44, 0x69, 0x73, 0x70, 0x6c, 0x61, 0x79, 0x4e, 0x61, 0x6d, 0x65,
            0x01, 0x00, 0x66,
            0x08, 0x04, 0x00, 0x4e, 0x61, 0x6d, 0x65,
            0x01, 0x00, 0x66,
            0x09, 0x06, 0x00, 0x53, 0x63, 0x6f, 0x72, 0x65, 0x73,
            0x00, 0x00, 0x00, 0x00, 0x00,
            0x00,
            0x00
        ]);
        entries.push({key:new TextEncoder().encode('scoreboard'),value:scoreboardBytes});

        const LDB_FILE_NUMBER=5;
        const ldbBytes=mcwBuildSSTable(entries);
        const sortedKeys=entries.map(e=>e.key).sort((a,b)=>{
            const n=Math.min(a.length,b.length);
            for(let i=0;i<n;i++)if(a[i]!==b[i])return a[i]-b[i];
            return a.length-b.length;
        });
        const smallestKey=sortedKeys[0];
        const largestKey=sortedKeys[sortedKeys.length-1];
        const manifestBytes=mcwBuildManifestWithLdb(0,LDB_FILE_NUMBER,ldbBytes.length,smallestKey,largestKey);
        const currentBytes=new TextEncoder().encode('MANIFEST-000004\n');

        const iconBytes=generateWorldIcon();

        const zip=new McwZipBuilder();
        await zip.addFile('level.dat',mcwBuildLevelDat(worldName),true);
        await zip.addFile(`db/00000${LDB_FILE_NUMBER}.ldb`,ldbBytes,true);
        await zip.addFile('db/CURRENT',currentBytes,true);
        await zip.addFile('db/MANIFEST-000004',manifestBytes,true);
        await zip.addFile('levelname.txt',new TextEncoder().encode(worldName),true);
        await zip.addFile('world_behavior_packs.json',new TextEncoder().encode('[]'),true);
        await zip.addFile('world_resource_packs.json',new TextEncoder().encode('[]'),true);
        await zip.addFile('world_icon.jpeg',iconBytes,false);

        const zipBytes=zip.build();
        const blob=new Blob([zipBytes],{type:'application/octet-stream'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;
        a.download=`${worldName}.mcworld`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setStatus('success',`存档导出成功！共 ${total} 个命令方块，${layers} 层。双击 ${worldName}.mcworld 即可导入。`);
    }

    exportMcWorldBtn.addEventListener('click',async function(){
        if(isProcessing){setStatus('warn','正在处理素材，请稍后再导出。');return;}
        if(!currentMode){setStatus('warn','请先转换图片或视频，再导出存档。');return;}
        this.disabled=true;
        const orig=this.innerHTML;
        this.innerHTML=`${ICONS.clock} 导出中...`;
        setStatus('clock','正在生成 .mcworld，请稍候...');
        try{
            await exportMcWorld();
        }catch(e){
            console.error(e);
            alert('导出失败：'+(e&&e.message?e.message:e));
            setStatus('error','存档导出失败：'+(e&&e.message?e.message:e));
        }finally{
            this.disabled=false;
            this.innerHTML=orig;
        }
    });

    /* ========== 窗口/容器尺寸变化时重新适配预览 ========== */
    window.addEventListener('resize', () => {
        _fitCacheKey = '';
        requestAnimationFrame(fitPreviewFontSize);
    });
    window.addEventListener('orientationchange', () => {
        _fitCacheKey = '';
        requestAnimationFrame(fitPreviewFontSize);
    });
    if (typeof ResizeObserver !== 'undefined' && previewBox) {
        const ro = new ResizeObserver(() => {
            _fitCacheKey = '';
            fitPreviewFontSize();
        });
        ro.observe(previewBox);
    }

    setStatus('info','上传图片或视频，点击转换生成。');
    videoControls.classList.add('hidden');
    videoPreviewControls.classList.add('hidden');
})();
</script>
</body>
</html>
