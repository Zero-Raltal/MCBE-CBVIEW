<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft BE 1.19+ 图片/视频 转 字符画 by ZeroRaltal</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body {
            background: #1e1e2f; color: #e0e0e0;
            display: flex; flex-direction: column; align-items: center;
            padding: 2rem 1rem; margin: 0; min-height: 100vh;
        }
        .container {
            max-width: 1000px; width: 100%;
            background: #2a2a3d; border-radius: 20px;
            padding: 2rem 1.5rem; box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        h1 { text-align: center; font-weight: 300; margin-top: 0; color: #b0b0e0; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
        h1 small { display: block; font-size: 0.6rem; color: #8888aa; margin-top: 6px; width: 100%; }
        .upload-area {
            display: flex; flex-wrap: wrap; gap: 16px;
            align-items: center; margin: 16px 0;
        }
        .file-input-wrapper { flex: 1; min-width: 200px; }
        .file-input-wrapper input[type="file"] {
            width: 100%; padding: 10px;
            background: #3a3a55; border: 1px dashed #6666aa;
            border-radius: 10px; color: #ccc; cursor: pointer;
        }
        .file-input-wrapper input[type="file"]::file-selector-button {
            background: #5a5a8a; border: none; color: white;
            padding: 6px 16px; border-radius: 6px; cursor: pointer;
        }
        .btn-convert {
            background: #6c6cd6; border: none; color: white;
            font-weight: bold; padding: 12px 28px; border-radius: 30px;
            font-size: 1rem; cursor: pointer; white-space: nowrap;
            transition: background 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-convert:hover:not(:disabled) { background: #8a8af0; }
        .btn-convert:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-convert.stop { background: #d45a5a; }
        .btn-convert.stop:hover:not(:disabled) { background: #e07070; }
        .slider-area {
            display: flex; align-items: center; gap: 16px;
            margin: 12px 0; flex-wrap: wrap;
        }
        .slider-area label { font-weight: bold; color: #b0b0d0; display: flex; align-items: center; gap: 6px; }
        .slider-area input[type="range"] {
            flex: 1; min-width: 140px;
            background: #3a3a55; height: 6px; border-radius: 3px;
            -webkit-appearance: none; appearance: none;
        }
        .slider-area input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; background: #8a8af0; border-radius: 50%; cursor: pointer;
        }
        .slider-value {
            background: #22223a; padding: 2px 12px; border-radius: 20px;
            min-width: 40px; text-align: center; font-weight: bold; color: #d0d0f0;
        }
        .extra-controls {
            display: flex; flex-wrap: wrap; gap: 20px;
            margin: 8px 0 12px; align-items: center;
        }
        .extra-controls label { color: #b0b0d0; display: flex; align-items: center; gap: 6px; }
        .extra-controls input[type="number"] {
            background: #3a3a55; color: #e0e0e0; border: 1px solid #6666aa;
            padding: 4px 8px; border-radius: 8px; width: 80px;
        }
        .info-row {
            display: flex; justify-content: space-between; flex-wrap: wrap;
            margin: 8px 0 16px; font-size: 0.9rem; color: #aaaac0;
        }
        .info-row span { background: #22223a; padding: 4px 12px; border-radius: 30px; }
        .preview-container {
            background: #0e0e1a; border-radius: 12px; padding: 16px 12px;
            margin: 16px 0 10px; border: 1px solid #3a3a5a;
        }
        .preview-container pre {
            margin: 0; font-family: 'Courier New', monospace;
            font-size: 10px; line-height: 1.2; white-space: pre;
            word-break: break-all;
        }
        .preview-controls {
            display: flex; align-items: center; flex-wrap: wrap;
            gap: 10px; margin-top: 10px; padding-top: 10px;
            border-top: 1px solid #3a3a5a;
        }
        .preview-controls button {
            background: #3a6a6a; border: none; color: white;
            padding: 4px 12px; border-radius: 16px; cursor: pointer;
            font-size: 12px;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .preview-controls button:hover { background: #4e8a8a; }
        .preview-controls .progress-bar-sm {
            flex: 1; min-width: 100px; height: 6px;
            background: #3a3a55; border-radius: 3px; cursor: pointer;
            position: relative;
        }
        .preview-controls .progress-fill-sm {
            height: 100%; width: 0%; background: #6c6cd6;
            border-radius: 3px; pointer-events: none;
        }
        .preview-controls .frame-info {
            font-size: 11px; color: #aaaac0; min-width: 80px;
        }
        .preview-controls input[type="range"] {
            width: 80px; height: 4px;
            -webkit-appearance: none; appearance: none;
            background: #3a3a55;
        }
        .preview-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px;
            border-radius: 50%; background: #6c6cd6; cursor: pointer;
        }
        .status-msg {
            font-size: 0.9rem; color: #d0d0a0; margin: 10px 0 6px 0;
            min-height: 1.5em; display: flex; align-items: center; gap: 6px;
        }
        .command-area { margin-top: 8px; }
        .command-area label {
            display: flex; justify-content: space-between;
            align-items: center; font-weight: bold; color: #b0b0d0;
            flex-wrap: wrap;
        }
        .copy-btn, .download-btn {
            background: #3a6a3a; border: none; color: white;
            padding: 6px 18px; border-radius: 20px; cursor: pointer;
            font-size: 0.9rem; margin-left: 12px;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .download-btn { background: #6a4a3a; }
        .be-btn { background: #4a6a8a; }
        .copy-btn:hover { background: #4e8a4e; }
        .download-btn:hover { background: #8a6a4a; }
        .be-btn:hover { background: #5e82a8; }
        .footer { margin-top: 20px; font-size: 0.8rem; color: #555577; }
        .hidden { display: none; }
        .progress-bar {
            width: 100%; background: #3a3a55; border-radius: 10px;
            margin: 10px 0; height: 20px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%; background: #6c6cd6;
            transition: width 0.2s;
        }
        .cmd-block {
            background: #0e0e1a; border-left: 4px solid #6c6cd6;
            margin: 4px 0; padding: 6px 10px;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap;
        }
        .cmd-block .seq-num {
            background: #3a3a55; padding: 2px 10px; border-radius: 12px;
            font-size: 12px; color: #b0b0e0;
        }
        .cmd-block .copy-btn-sm {
            background: #3a6a3a; border: none; color: white;
            padding: 2px 14px; border-radius: 12px; cursor: pointer;
            font-size: 12px;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .cmd-block .copy-btn-sm:hover { background: #4e8a4e; }
        .cmd-block .cmd-label {
            font-size: 12px; color: #aaaac0; flex: 1; margin: 0 10px;
        }
        .svg-icon {
            display: inline-block; vertical-align: middle;
            width: 1.2em; height: 1.2em; fill: currentColor;
            flex-shrink: 0;
        }
        .svg-icon-sm {
            width: 1em; height: 1em;
        }
        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .preview-container pre { font-size: 6px; }
            .btn-convert { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="container">

        <select id="cmdMode">

        <span style="font-size:0.8rem; color:#8888aa;">切换此选项不需要重新生成</span>

    <div class="preview-container" id="previewContainer">

        </pre>
        <div id="videoPreviewControls" class="preview-controls hidden">

            <button id="loopBtn" style="background:#3a3a55;">
                <svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" fill="currentColor"/></svg>

            </button>

    <div class="status-msg" id="statusMsg">
        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="1.5"/></svg>
        上传图片或视频，点击转换生成。
    </div>

    <div class="command-area">
        <label>
            <span>
                <svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M8 7h8M8 12h8M8 17h5" stroke="currentColor" stroke-width="1.5"/></svg>
                输出命令
            </span>
            <span>
                <button class="copy-btn" id="copyAllBtn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
                    复制全部
                </button>
                <button class="download-btn" id="downloadBtn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor"/></svg>
                    下载为 .txt
                </button>
                <button class="be-btn" id="exportBEStructBtn">
                    <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
                    导出 .mcstructure
                </button>
            </span>
        </label>
        <div id="commandList"></div>
    </div>

    <div class="footer">@ ZeroRaltal</div>
</div>

<script>
    (function() {
        // SVG 图标常量
        const ICONS = {
            play: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="currentColor"/></svg>`,
            pause: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></svg>`,
            stop: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="currentColor"/></svg>`,
            loop: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" fill="currentColor"/></svg>`,
            copy: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>`,
            download: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor"/></svg>`,
            check: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="currentColor"/></svg>`,
            warn: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm10-3h2v2h-2v-2zm0-8h2v6h-2v-6z" fill="currentColor"/></svg>`,
            error: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="currentColor"/></svg>`,
            info: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="1.5"/></svg>`,
            clock: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"/><polyline points="12 6 12 12 16 14" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>`,
            refresh: `<svg class="svg-icon svg-icon-sm" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" fill="currentColor"/></svg>`,
        };

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? [
                parseInt(result[1], 16),
                parseInt(result[2], 16),
                parseInt(result[3], 16)
            ] : [0, 0, 0];
        }

        const colorData = [
            { code: '0', hex: '#000000', isGray: true },
            { code: '1', hex: '#0000AA', isGray: false },
            { code: '2', hex: '#00AA00', isGray: false },
            { code: '3', hex: '#00AAAA', isGray: false },
            { code: '4', hex: '#AA0000', isGray: false },
            { code: '5', hex: '#AA00AA', isGray: false },
            { code: '6', hex: '#FFAA00', isGray: false },
            { code: '7', hex: '#C5C5C5', isGray: true },
            { code: '8', hex: '#545454', isGray: true },
            { code: '9', hex: '#5454FF', isGray: false },
            { code: 'a', hex: '#54FF54', isGray: false },
            { code: 'b', hex: '#54FFFF', isGray: false },
            { code: 'c', hex: '#FF5454', isGray: false },
            { code: 'd', hex: '#D747D7', isGray: false },
            { code: 'e', hex: '#FFFF54', isGray: false },
            { code: 'f', hex: '#FFFFFF', isGray: true },
            { code: 'g', hex: '#C2A712', isGray: false },
            { code: 'h', hex: '#E2D3D1', isGray: false },
            { code: 'i', hex: '#CEC9C9', isGray: false },
            { code: 'j', hex: '#44393A', isGray: false },
            { code: 'm', hex: '#961506', isGray: false },
            { code: 'n', hex: '#B4684D', isGray: false },
            { code: 'p', hex: '#DEB02C', isGray: false },
            { code: 'q', hex: '#119F36', isGray: false },
            { code: 's', hex: '#2CB9A8', isGray: false },
            { code: 't', hex: '#20487A', isGray: false },
            { code: 'u', hex: '#9A5CC5', isGray: false }
        ];

        const COLORS = colorData.map(c => ({
            code: c.code,
            hex: c.hex,
            rgb: hexToRgb(c.hex),
            isGray: c.isGray
        }));

        /* ============================================================
           性能优化：颜色查找表 (LUT)
           ------------------------------------------------------------
           原算法: 每个像素 * 遍历27色 * 距离计算 = 4096 * 27 = ~11万次
           优化后: 5bit 量化 (32x32x32) 预计算最近色 -> O(1) 查表
           ============================================================ */
        const LUT_BITS = 5;                    // 每通道5bit
        const LUT_SHIFT = 8 - LUT_BITS;        // 右移3位
        const LUT_SIZE = 1 << (LUT_BITS * 3);  // 32768
        const LUT_MASK = (1 << LUT_BITS) - 1;  // 31
        const LUT_R_SHIFT = LUT_BITS * 2;      // 10
        const LUT_G_SHIFT = LUT_BITS;          // 5

        let lutIndex = null;
        let lutBoostFactor = null;

        // 预提取调色板到 typed array，避免 LUT 构建时反复访问对象
        const PAL_R = new Float32Array(COLORS.length);
        const PAL_G = new Float32Array(COLORS.length);
        const PAL_B = new Float32Array(COLORS.length);
        const PAL_GRAY = new Uint8Array(COLORS.length);
        for (let i = 0; i < COLORS.length; i++) {
            PAL_R[i] = COLORS[i].rgb[0];
            PAL_G[i] = COLORS[i].rgb[1];
            PAL_B[i] = COLORS[i].rgb[2];
            PAL_GRAY[i] = COLORS[i].isGray ? 1 : 0;
        }

        function buildColorLUT(boostFactor) {
            const n = COLORS.length;
            const idx = new Uint8Array(LUT_SIZE);
            const mid = 4; // 桶中心偏移
            let p = 0;
            // 循环顺序与查找索引位段一致: r5<<10 | g5<<5 | b5
            for (let r5 = 0; r5 <= LUT_MASK; r5++) {
                const r = (r5 << LUT_SHIFT) + mid;
                for (let g5 = 0; g5 <= LUT_MASK; g5++) {
                    const g = (g5 << LUT_SHIFT) + mid;
                    for (let b5 = 0; b5 <= LUT_MASK; b5++, p++) {
                        const b = (b5 << LUT_SHIFT) + mid;
                        const mx = r > g ? (r > b ? r : b) : (g > b ? g : b);
                        const mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
                        const isGray = (mx - mn) < 25;

                        let best = 0;
                        let bestDist = Infinity;
                        for (let i = 0; i < n; i++) {
                            const dr = r - PAL_R[i];
                            const dg = g - PAL_G[i];
                            const db = b - PAL_B[i];
                            let d = 0.299 * dr * dr + 0.587 * dg * dg + 0.114 * db * db;
                            if (PAL_GRAY[i] && !isGray) d *= boostFactor;
                            if (d < bestDist) { bestDist = d; best = i; }
                        }
                        idx[p] = best;
                    }
                }
            }
            lutIndex = idx;
            lutBoostFactor = boostFactor;
        }

        function ensureLUT(boostFactor) {
            if (lutIndex === null || lutBoostFactor !== boostFactor) {
                buildColorLUT(boostFactor);
            }
        }

        /* ============================================================
           抖动缓冲复用: 避免每帧重新分配 64KB Float32Array
           ============================================================ */
        let ditherBuffer = null;

        // 工作 canvas 复用 (willReadFrequently 让 getImageData 走 CPU 内存)
        let workCanvas = null;
        function getWorkCanvas() {
            if (!workCanvas) {
                workCanvas = document.createElement('canvas');
                workCanvas.width = 128;
                workCanvas.height = 32;
                workCanvas.__ditherCtx = workCanvas.getContext('2d', {
                    willReadFrequently: true
                });
            }
            return workCanvas;
        }

        /* ============================================================
           核心: 带 Floyd-Steinberg 抖动的字符画生成 (优化版)
           ============================================================ */
        function canvasToCharArtWithDithering(canvas, boostFactor) {
            const W = 128, H = 32;
            const ctx = canvas.__ditherCtx ||
                (canvas.__ditherCtx = canvas.getContext('2d', { willReadFrequently: true }));
            const imgData = ctx.getImageData(0, 0, W, H);
            const data = imgData.data;
            const len = data.length;

            // 复用抖动缓冲，一次性拷贝
            if (!ditherBuffer || ditherBuffer.length !== len) {
                ditherBuffer = new Float32Array(len);
            }
            const pixels = ditherBuffer;
            pixels.set(data);

            ensureLUT(boostFactor);
            const lut = lutIndex;

            const LSH = LUT_SHIFT;
            const RSH = LUT_R_SHIFT;
            const GSH = LUT_G_SHIFT;

            let charArt = '§l';
            let lastCode = null;
            const rowStride = W * 4;

            for (let row = 0; row < H; row++) {
                const rowOff = row * rowStride;
                for (let col = 0; col < W; col++) {
                    const idx = rowOff + col * 4;
                    let r = pixels[idx];
                    let g = pixels[idx + 1];
                    let b = pixels[idx + 2];

                    // clamp 抖动产生的越界值
                    if (r < 0) r = 0; else if (r > 255) r = 255;
                    if (g < 0) g = 0; else if (g > 255) g = 255;
                    if (b < 0) b = 0; else if (b > 255) b = 255;

                    // O(1) 查表得到最近颜色
                    const ci = lut[
                        ((r >> LSH) << RSH) |
                        ((g >> LSH) << GSH) |
                        (b >> LSH)
                    ];
                    const color = COLORS[ci];
                    const code = color.code;

                    if (code !== lastCode) {
                        charArt += '§' + code;
                        lastCode = code;
                    }
                    charArt += '|';

                    // 误差扩散 (7/16, 3/16, 5/16, 1/16)
                    const er = r - color.rgb[0];
                    const eg = g - color.rgb[1];
                    const eb = b - color.rgb[2];

                    if (col + 1 < W) {
                        const n = idx + 4;
                        pixels[n]     += er * 0.4375;
                        pixels[n + 1] += eg * 0.4375;
                        pixels[n + 2] += eb * 0.4375;
                    }
                    if (row + 1 < H) {
                        const nextOff = rowOff + rowStride;
                        if (col > 0) {
                            const n = nextOff + (col - 1) * 4;
                            pixels[n]     += er * 0.1875;
                            pixels[n + 1] += eg * 0.1875;
                            pixels[n + 2] += eb * 0.1875;
                        }
                        {
                            const n = nextOff + col * 4;
                            pixels[n]     += er * 0.3125;
                            pixels[n + 1] += eg * 0.3125;
                            pixels[n + 2] += eb * 0.3125;
                        }
                        if (col + 1 < W) {
                            const n = nextOff + (col + 1) * 4;
                            pixels[n]     += er * 0.0625;
                            pixels[n + 1] += eg * 0.0625;
                            pixels[n + 2] += eb * 0.0625;
                        }
                    }
                }
                if (row < H - 1) {
                    charArt += '\n';
                    lastCode = null;
                }
            }

            return charArt;
        }

        function buildSingleCommand(charArt, mode) {
            let text = charArt;
            if (mode === 'titleraw') {
                text += '\n'.repeat(16);
            }
            const escaped = text.replace(/\n/g, '\\n');
            const json = `{"rawtext":[{"text":"${escaped}"}]}`;
            if (mode === 'tellraw') {
                return `tellraw @a ${json}`;
            } else {
                return `titleraw @a actionbar ${json}`;
            }
        }

        function renderPreview(charArt) {
            let currentColor = '#FFFFFF';
            const parts = [];
            let i = 0;
            while (i < charArt.length) {
                const ch = charArt[i];
                if (ch === '§' && i + 1 < charArt.length) {
                    const code = charArt[i + 1];
                    const colorObj = COLORS.find(c => c.code === code);
                    if (colorObj) currentColor = colorObj.hex;
                    i += 2;
                    continue;
                }
                if (ch === '\n') {
                    parts.push('\n');
                    i++;
                    continue;
                }
                parts.push(`<span style="color:${currentColor};">${ch}</span>`);
                i++;
            }
            return parts.join('');
        }

        // ---------- DOM ----------
        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const previewPre = document.getElementById('previewPre');
        const commandList = document.getElementById('commandList');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const exportBEStructBtn = document.getElementById('exportBEStructBtn');
        const statusMsg = document.getElementById('statusMsg');
        const colorBoostSlider = document.getElementById('colorBoost');
        const boostValueDisplay = document.getElementById('boostValue');
        const cmdModeSelect = document.getElementById('cmdMode');
        const videoControls = document.getElementById('videoControls');
        const fpsSlider = document.getElementById('fpsSlider');
        const fpsValue = document.getElementById('fpsValue');
        const delayInput = document.getElementById('delayInput');
        const progressFill = document.getElementById('progressFill');
        const videoInfo = document.getElementById('videoInfo');
        const videoPreviewControls = document.getElementById('videoPreviewControls');
        const previewProgressBar = document.getElementById('previewProgressBar');
        const previewProgressFill = document.getElementById('previewProgressFill');
        const frameInfo = document.getElementById('frameInfo');
        const previewSpeedSlider = document.getElementById('previewSpeedSlider');
        const previewSpeedValue = document.getElementById('previewSpeedValue');

        let currentMode = null;
        let imageData = null;
        let videoFrameData = null;
        let isProcessing = false;
        let stopRequested = false;

        colorBoostSlider.addEventListener('input', () => {
            boostValueDisplay.textContent = parseFloat(colorBoostSlider.value).toFixed(1);
        });

        fpsSlider.addEventListener('input', () => {
            const fps = parseInt(fpsSlider.value);
            fpsValue.textContent = fps;
            let delay = Math.round(20 / fps);
            if (delay < 1) delay = 1;
            if (delay > 20) delay = 20;
            delayInput.value = delay;
        });

        delayInput.addEventListener('change', () => {
            let val = parseInt(delayInput.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 20) val = 20;
            delayInput.value = val;
        });

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            commandList.innerHTML = '';
            previewPre.innerHTML = '上传图片或视频后点击转换';
            videoPreviewControls.classList.add('hidden');
            imageData = null;
            videoFrameData = null;
            currentMode = null;
            commandList._allCmds = null;
            if (previewTimer) {
                clearInterval(previewTimer);
                previewTimer = null;
            }
            isPlaying = false;
            const pb = document.getElementById('playPauseBtn');
            if (pb) pb.innerHTML = `${ICONS.play} 播放`;

            if (!file) {
                videoControls.classList.add('hidden');
                setStatus('info', '请选择文件');
                return;
            }
            const type = file.type;
            if (type.startsWith('video/')) {
                videoControls.classList.remove('hidden');
                videoInfo.textContent = `已选择: ${file.name}`;
                progressFill.style.width = '0%';
                setStatus('info', '视频已加载，调整参数后点击转换');
            } else if (type.startsWith('image/')) {
                videoControls.classList.add('hidden');
                setStatus('info', '图片已加载，点击转换');
            } else {
                videoControls.classList.add('hidden');
                setStatus('error', '不支持的文件类型');
            }
        });

        function setStatus(type, msg) {
            const iconMap = {
                info: ICONS.info, success: ICONS.check, error: ICONS.error,
                warn: ICONS.warn, clock: ICONS.clock, refresh: ICONS.refresh
            };
            statusMsg.innerHTML = `${iconMap[type] || ICONS.info} ${msg}`;
        }

        // ---------- 图片处理（复用工作 canvas + LUT） ----------
        async function processImage(file) {
            if (isProcessing) return;
            isProcessing = true;
            convertBtn.disabled = true;
            convertBtn.innerHTML = `${ICONS.clock} 处理中...`;
            setStatus('clock', '正在处理图片...');
            try {
                const boost = parseFloat(colorBoostSlider.value);
                const mode = cmdModeSelect.value;
                const img = await loadImage(file);

                const canvas = getWorkCanvas();
                const ctx = canvas.__ditherCtx;
                ctx.clearRect(0, 0, 128, 32);
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(img, 0, 0, 128, 32);

                const charArt = canvasToCharArtWithDithering(canvas, boost);
                const singleCmd = buildSingleCommand(charArt, mode);
                imageData = { charArt, singleCmd };
                currentMode = 'image';
                previewPre.innerHTML = renderPreview(charArt);
                videoControls.classList.add('hidden');
                videoPreviewControls.classList.add('hidden');
                commandList.innerHTML = `
                    <div class="cmd-block">
                        <span class="seq-num">#1</span>
                        <span class="cmd-label">图片字符画</span>
                        <button class="copy-btn-sm" data-cmd="${encodeURIComponent(singleCmd)}">${ICONS.copy} 复制</button>
                    </div>
                `;
                commandList._allCmds = [singleCmd];
                bindCopyButtons();
                setStatus('success', '图片转换成功！');
            } catch (err) {
                setStatus('error', err.message);
            } finally {
                isProcessing = false;
                convertBtn.disabled = false;
                convertBtn.innerHTML = `${ICONS.check} 转换并生成命令`;
                convertBtn.classList.remove('stop');
            }
        }

        // ---------- 视频处理（去掉 30ms sleep + 复用 canvas + 分帧 yield） ----------
        async function processVideo(file) {
            if (isProcessing) return;
            isProcessing = true;
            stopRequested = false;
            convertBtn.disabled = false;
            convertBtn.innerHTML = `${ICONS.stop} 停止`;
            convertBtn.classList.add('stop');
            setStatus('clock', '正在加载视频...');
            progressFill.style.width = '0%';
            videoControls.classList.remove('hidden');

            try {
                const boost = parseFloat(colorBoostSlider.value);
                const mode = cmdModeSelect.value;
                const fps = parseInt(fpsSlider.value);
                let delay = parseInt(delayInput.value);
                if (isNaN(delay) || delay < 1) delay = 1;
                if (delay > 20) delay = 20;
                delayInput.value = delay;

                const video = await loadVideo(file);
                const duration = video.duration;
                if (!duration || duration <= 0) throw new Error('无法获取视频时长');
                const totalFrames = Math.floor(duration * fps);
                if (totalFrames < 1) throw new Error('视频时长太短或帧率太低，无有效帧');
                videoInfo.textContent = `时长 ${duration.toFixed(2)}s | 帧率 ${fps} FPS | 总帧数 ${totalFrames}`;

                const canvas = getWorkCanvas();
                const ctx = canvas.__ditherCtx;
                ctx.imageSmoothingEnabled = true;

                const allCharArts = new Array(totalFrames);
                let failedFrames = 0;

                for (let i = 1; i <= totalFrames; i++) {
                    if (stopRequested) {
                        setStatus('warn', '用户停止处理。');
                        progressFill.style.width = '0%';
                        videoInfo.textContent = '已停止';
                        return;
                    }
                    const time = Math.min(i / fps, duration - 0.001);
                    try {
                        await seekVideo(video, time);
                        ctx.drawImage(video, 0, 0, 128, 32);
                        allCharArts[i - 1] = canvasToCharArtWithDithering(canvas, boost);
                    } catch (seekErr) {
                        failedFrames++;
                        allCharArts[i - 1] = '';
                    }
                    // 每 20 帧更新一次 UI，让出主线程
                    if ((i % 20) === 0 || i === totalFrames) {
                        progressFill.style.width = ((i / totalFrames) * 100) + '%';
                        setStatus('clock', `处理帧 ${i}/${totalFrames} (跳过 ${failedFrames} 帧)`);
                        await new Promise(r => setTimeout(r, 0));
                    }
                }

                videoFrameData = {
                    allCharArts: allCharArts,
                    totalFrames: totalFrames,
                    fps: fps,
                    failedFrames: failedFrames
                };
                currentMode = 'video';

                generateVideoCommands(videoFrameData, mode, delay);
                initVideoPreview(videoFrameData);

                if (allCharArts.length > 0 && allCharArts[0]) {
                    previewPre.innerHTML = renderPreview(allCharArts[0]);
                } else {
                    previewPre.innerHTML = '无有效帧';
                }
                setStatus('success', `视频处理完成！有效帧 ${totalFrames - failedFrames}，延迟 ${delay} tick。`);
                progressFill.style.width = '100%';
            } catch (err) {
                setStatus('error', err.message);
                console.error(err);
            } finally {
                isProcessing = false;
                convertBtn.disabled = false;
                convertBtn.innerHTML = `${ICONS.check} 转换并生成命令`;
                convertBtn.classList.remove('stop');
                stopRequested = false;
            }
        }

        function generateVideoCommands(data, mode, delay) {
            if (!data) return;
            const { allCharArts } = data;

            const objectiveCmd = 'scoreboard objectives add f dummy';
            const pulseCmd = 'scoreboard players set f f 0';
            const loopCmd = `scoreboard players add f f 1`;

            let allCmds = [];
            const headerCmds = [
                { label: '创建计分板', cmd: objectiveCmd },
                { label: '脉冲归零', cmd: pulseCmd },
                { label: `循环 (延迟 ${delay} tick)`, cmd: loopCmd }
            ];
            let chainCmds = [];
            for (let i = 0; i < allCharArts.length; i++) {
                const charArt = allCharArts[i];
                if (!charArt) {
                    chainCmds.push(`# Frame ${i+1} skipped`);
                    continue;
                }
                const singleCmd = buildSingleCommand(charArt, mode);
                chainCmds.push(`execute if score f f matches ${i+1} run ${singleCmd}`);
            }

            let html = '';
            let seq = 1;
            for (const h of headerCmds) {
                allCmds.push(h.cmd);
                html += `
                    <div class="cmd-block">
                        <span class="seq-num">#${seq}</span>
                        <span class="cmd-label">${h.label}</span>
                        <button class="copy-btn-sm" data-cmd="${encodeURIComponent(h.cmd)}">${ICONS.copy} 复制</button>
                    </div>
                `;
                seq++;
            }
            for (let i = 0; i < chainCmds.length; i++) {
                const cmd = chainCmds[i];
                allCmds.push(cmd);
                html += `
                    <div class="cmd-block">
                        <span class="seq-num">#${seq}</span>
                        <span class="cmd-label">连锁 #${i+1}</span>
                        <button class="copy-btn-sm" data-cmd="${encodeURIComponent(cmd)}">${ICONS.copy} 复制</button>
                    </div>
                `;
                seq++;
            }
            commandList.innerHTML = html;
            commandList._allCmds = allCmds;
            bindCopyButtons();
        }

        function bindCopyButtons() {
            document.querySelectorAll('.cmd-block .copy-btn-sm').forEach(btn => {
                btn.addEventListener('click', function() {
                    const cmd = decodeURIComponent(this.dataset.cmd);
                    copyToClipboard(cmd, this);
                });
            });
        }

        // ---------- 视频预览 ----------
        let previewTimer = null;
        let currentFrameIndex = 0;
        let isPlaying = false;
        let loopEnabled = false;
        let previewFrames = [];
        let previewFps = 1;

        function initVideoPreview(data) {
            if (!data || !data.allCharArts || data.allCharArts.length === 0) {
                videoPreviewControls.classList.add('hidden');
                return;
            }
            previewFrames = data.allCharArts.filter(c => c !== '');
            if (previewFrames.length === 0) {
                videoPreviewControls.classList.add('hidden');
                return;
            }
            previewFps = data.fps || 1;
            currentFrameIndex = 0;
            isPlaying = false;
            if (previewTimer) {
                clearInterval(previewTimer);
                previewTimer = null;
            }
            videoPreviewControls.classList.remove('hidden');
            updatePreviewFrame(0);
            frameInfo.textContent = `1 / ${previewFrames.length}`;
            previewProgressFill.style.width = '0%';
            const oldPlayBtn = document.getElementById('playPauseBtn');
            const oldLoopBtn = document.getElementById('loopBtn');
            const playBtn = oldPlayBtn.cloneNode(true);
            oldPlayBtn.parentNode.replaceChild(playBtn, oldPlayBtn);
            const loopBtnEl = oldLoopBtn.cloneNode(true);
            oldLoopBtn.parentNode.replaceChild(loopBtnEl, oldLoopBtn);
            playBtn.innerHTML = `${ICONS.play} 播放`;
            const progBar = document.getElementById('previewProgressBar');
            const progFill = document.getElementById('previewProgressFill');
            const frameInfoEl = document.getElementById('frameInfo');
            const speedSlider = document.getElementById('previewSpeedSlider');
            const speedVal = document.getElementById('previewSpeedValue');

            playBtn.addEventListener('click', function() {
                if (isPlaying) pausePreview();
                else playPreview();
            });

            let isDraggingPreview = false;
            function seekPreviewAt(clientX) {
                const rect = progBar.getBoundingClientRect();
                const x = (clientX - rect.left) / rect.width;
                const idx = Math.floor(x * previewFrames.length);
                if (idx >= 0 && idx < previewFrames.length) {
                    currentFrameIndex = idx;
                    updatePreviewFrame(idx);
                    frameInfoEl.textContent = `${idx+1} / ${previewFrames.length}`;
                    progFill.style.width = (idx / (previewFrames.length - 1)) * 100 + '%';
                }
            }
            progBar.addEventListener('mousedown', function(e) {
                isDraggingPreview = true;
                seekPreviewAt(e.clientX);
            });
            window.addEventListener('mousemove', function(e) {
                if (isDraggingPreview) seekPreviewAt(e.clientX);
            });
            window.addEventListener('mouseup', function() {
                if (isDraggingPreview) {
                    isDraggingPreview = false;
                    if (isPlaying) { pausePreview(); playPreview(); }
                }
            });

            speedSlider.addEventListener('input', function() {
                const val = parseFloat(this.value);
                speedVal.textContent = val.toFixed(1) + 'x';
                if (isPlaying) { pausePreview(); playPreview(); }
            });

            loopBtnEl.addEventListener('click', function() {
                loopEnabled = !loopEnabled;
                this.style.background = loopEnabled ? '#4e8a8a' : '#3a3a55';
                this.innerHTML = loopEnabled ? `${ICONS.loop} 循环开` : `${ICONS.loop} 循环`;
            });
        }

        function updatePreviewFrame(index) {
            if (index < 0 || index >= previewFrames.length) return;
            previewPre.innerHTML = renderPreview(previewFrames[index]);
            const progFill = document.getElementById('previewProgressFill');
            if (progFill) progFill.style.width = (index / (previewFrames.length - 1)) * 100 + '%';
            const frameInfoEl = document.getElementById('frameInfo');
            if (frameInfoEl) frameInfoEl.textContent = `${index+1} / ${previewFrames.length}`;
        }

        function playPreview() {
            if (isPlaying) return;
            if (currentFrameIndex >= previewFrames.length - 1) {
                currentFrameIndex = 0;
                updatePreviewFrame(0);
            }
            isPlaying = true;
            document.getElementById('playPauseBtn').innerHTML = `${ICONS.pause} 暂停`;
            const speed = parseFloat(document.getElementById('previewSpeedSlider').value);
            const interval = 1000 / (previewFps * speed);
            if (previewTimer) clearInterval(previewTimer);
            previewTimer = setInterval(function() {
                if (currentFrameIndex < previewFrames.length - 1) {
                    currentFrameIndex++;
                    updatePreviewFrame(currentFrameIndex);
                } else {
                    if (loopEnabled) {
                        currentFrameIndex = 0;
                        updatePreviewFrame(0);
                    } else {
                        pausePreview();
                    }
                }
            }, interval);
        }

        function pausePreview() {
            isPlaying = false;
            if (previewTimer) { clearInterval(previewTimer); previewTimer = null; }
            document.getElementById('playPauseBtn').innerHTML = `${ICONS.play} 播放`;
        }

        // ---------- 辅助 ----------
        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('图片加载失败'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsDataURL(file);
            });
        }

        function loadVideo(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const video = document.createElement('video');
                video.preload = 'auto';
                video.muted = true;
                video.playsInline = true;
                video.onloadedmetadata = () => resolve(video);
                video.onerror = () => { URL.revokeObjectURL(url); reject(new Error('视频加载失败')); };
                video.src = url;
            });
        }

        function seekVideo(video, time) {
            return new Promise((resolve) => {
                if (Math.abs(video.currentTime - time) < 0.005) { resolve(); return; }
                let resolved = false;
                const done = () => {
                    if (!resolved) {
                        resolved = true;
                        video.onseeked = null;
                        resolve();
                    }
                };
                video.onseeked = done;
                try {
                    video.currentTime = time;
                } catch (e) {
                    done();
                    return;
                }
                setTimeout(done, 1200);
            });
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const orig = btn.innerHTML;
                btn.innerHTML = `${ICONS.check} 已复制`;
                setTimeout(() => btn.innerHTML = orig, 2000);
            }).catch(() => alert('复制失败'));
        }

        // ---------- 事件 ----------
        convertBtn.addEventListener('click', async function() {
            if (isProcessing) {
                stopRequested = true;
                this.disabled = true;
                this.innerHTML = `${ICONS.stop} 正在停止...`;
                setStatus('warn', '正在停止处理...');
                return;
            }
            const file = fileInput.files[0];
            if (!file) { setStatus('warn', '请选择文件！'); return; }
            const type = file.type;
            if (type.startsWith('image/')) {
                videoControls.classList.add('hidden');
                await processImage(file);
            } else if (type.startsWith('video/')) {
                await processVideo(file);
            } else {
                setStatus('error', '不支持的文件类型，请上传图片或视频。');
            }
        });

        cmdModeSelect.addEventListener('change', () => {
            if (currentMode === 'image' && imageData) {
                const singleCmd = buildSingleCommand(imageData.charArt, cmdModeSelect.value);
                imageData.singleCmd = singleCmd;
                commandList.innerHTML = `
                    <div class="cmd-block">
                        <span class="seq-num">#1</span>
                        <span class="cmd-label">图片字符画</span>
                        <button class="copy-btn-sm" data-cmd="${encodeURIComponent(singleCmd)}">${ICONS.copy} 复制</button>
                    </div>
                `;
                commandList._allCmds = [singleCmd];
                bindCopyButtons();
                setStatus('success', '命令模式已切换，无需重新转换。');
                setTimeout(() => setStatus('info', '命令模式切换完成'), 3000);
            } else if (currentMode === 'video' && videoFrameData) {
                generateVideoCommands(videoFrameData, cmdModeSelect.value, parseInt(delayInput.value));
                setStatus('success', '命令模式已切换，无需重新转换。');
                setTimeout(() => setStatus('info', '命令模式切换完成'), 3000);
            } else {
                setStatus('warn', '请先转换图片或视频再切换模式。');
            }
        });

        copyAllBtn.addEventListener('click', () => {
            const allCmds = commandList._allCmds;
            if (!allCmds || allCmds.length === 0) { setStatus('warn', '没有命令可复制。'); return; }
            const text = allCmds.join('\n\n');
            navigator.clipboard.writeText(text).then(() => {
                setStatus('success', '全部命令已复制！');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                setStatus('success', '已复制（旧方法）！');
            });
        });

        downloadBtn.addEventListener('click', () => {
            const allCmds = commandList._allCmds;
            if (!allCmds || allCmds.length === 0) { setStatus('warn', '没有命令可下载。'); return; }
            const text = allCmds.join('\n\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'commands.txt';
            a.click();
            URL.revokeObjectURL(url);
            setStatus('success', '文件已下载！');
        });

        /* ==================== 基岩版 .mcstructure 导出 ==================== */
        function randomName() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let s = '';
            for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
            return s;
        }

        function bPutU16(a, v) { a.push(v & 0xFF, (v >> 8) & 0xFF); }
        function bPutI32(a, v) { a.push(v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF); }
        function bPutStr(a, s) {
            const b = new TextEncoder().encode(s);
            bPutU16(a, b.length);
            for (let i = 0; i < b.length; i++) a.push(b[i]);
        }
        function bPutTag(a, type, name, val) {
            a.push(type);
            if (type === 0) return;
            bPutStr(a, name);
            bPutVal(a, type, val);
        }
        function bPutVal(a, type, val) {
            switch (type) {
                case 1: a.push(val & 0xFF); break;
                case 2: bPutU16(a, val); break;
                case 3: bPutI32(a, val); break;
                case 4: {
                    const dv = new DataView(new ArrayBuffer(8));
                    dv.setBigInt64(0, BigInt(val), true);
                    const u = new Uint8Array(dv.buffer);
                    for (let i = 0; i < 8; i++) a.push(u[i]);
                    break;
                }
                case 5: {
                    const dv = new DataView(new ArrayBuffer(4));
                    dv.setFloat32(0, val, true);
                    const u = new Uint8Array(dv.buffer);
                    for (let i = 0; i < 4; i++) a.push(u[i]);
                    break;
                }
                case 6: {
                    const dv = new DataView(new ArrayBuffer(8));
                    dv.setFloat64(0, val, true);
                    const u = new Uint8Array(dv.buffer);
                    for (let i = 0; i < 8; i++) a.push(u[i]);
                    break;
                }
                case 7: bPutI32(a, val.length); for (let i = 0; i < val.length; i++) a.push(val[i] & 0xFF); break;
                case 8: bPutStr(a, val); break;
                case 9: a.push(val.itemType); bPutI32(a, val.items.length); for (const it of val.items) bPutVal(a, val.itemType, it); break;
                case 10: for (const t of val) bPutTag(a, t.type, t.name, t.value); a.push(0); break;
                case 11: bPutI32(a, val.length); for (const v of val) bPutI32(a, v); break;
            }
        }
        function bSerializeBE(root) {
            const a = [];
            bPutTag(a, 10, '', root);
            return new Uint8Array(a);
        }

        const B_LAYER_W = 8, B_LAYER_D = 8;
        const B_PER_LAYER = B_LAYER_W * B_LAYER_D;

        function bePosOf(idx) {
            const layer = Math.floor(idx / B_PER_LAYER);
            const within = idx % B_PER_LAYER;
            const row = Math.floor(within / B_LAYER_W);
            const col = within % B_LAYER_W;
            const reverse = (layer % 2 === 1);
            let z, x;
            if (!reverse) {
                z = row;
                x = (row % 2 === 0) ? col : (B_LAYER_W - 1 - col);
            } else {
                z = B_LAYER_D - 1 - row;
                x = (row % 2 === 0) ? col : (B_LAYER_W - 1 - col);
            }
            return { x, y: layer, z };
        }
        function beFacingOf(a, b) {
            if (b.y > a.y) return 'up';
            if (b.y < a.y) return 'down';
            if (b.x > a.x) return 'east';
            if (b.x < a.x) return 'west';
            if (b.z > a.z) return 'south';
            if (b.z < a.z) return 'north';
            return 'up';
        }
        function facingToBE(f) {
            switch (f) {
                case 'down': return 0;
                case 'up': return 1;
                case 'north': return 2;
                case 'south': return 3;
                case 'west': return 4;
                case 'east': return 5;
                default: return 1;
            }
        }

        function exportBEStructure() {
            const cmdEntries = [];
            if (currentMode === 'image' && imageData) {
                cmdEntries.push({ type: 'repeat', cmd: imageData.singleCmd, tickDelay: 0 });
            } else if (currentMode === 'video' && videoFrameData) {
                const allCharArts = videoFrameData.allCharArts;
                let delay = parseInt(delayInput.value);
                if (isNaN(delay) || delay < 1) delay = 1;
                if (delay > 20) delay = 20;
                const mode = cmdModeSelect.value;
                cmdEntries.push({
                    type: 'pulse',
                    cmd: 'scoreboard players set f f 0',
                    tickDelay: 0
                });
                cmdEntries.push({
                    type: 'repeat',
                    cmd: 'scoreboard players add f f 1',
                    tickDelay: delay - 1
                });
                for (let i = 0; i < allCharArts.length; i++) {
                    if (!allCharArts[i]) continue;
                    const singleCmd = buildSingleCommand(allCharArts[i], mode);
                    cmdEntries.push({
                        type: 'chain',
                        cmd: `execute if score f f matches ${i + 1} run ${singleCmd}`,
                        tickDelay: 0
                    });
                }
                cmdEntries.push({
                    type: 'chain',
                    cmd: `execute if score f f matches ${allCharArts.length + 1}.. run scoreboard players set f f 0`,
                    tickDelay: 0
                });
            } else {
                alert('请先转换图片或视频，再导出结构。');
                return;
            }
            if (cmdEntries.length === 0) { alert('没有可导出的命令方块。'); return; }

            const total = cmdEntries.length;
            const layers = Math.ceil(total / B_PER_LAYER);
            const sizeX = B_LAYER_W, sizeY = layers, sizeZ = B_LAYER_D;
            const totalBlocks = sizeX * sizeY * sizeZ;
            const blockIndices = new Array(totalBlocks).fill(0);
            const blockPositionData = new Map();

            const palette = [];
            const paletteMap = new Map();
            function getPaletteIdx(name, states) {
                const key = name + '|' + JSON.stringify(states);
                if (paletteMap.has(key)) return paletteMap.get(key);
                palette.push({ name, states, version: 17959425 });
                const i = palette.length - 1;
                paletteMap.set(key, i);
                return i;
            }
            getPaletteIdx('minecraft:air', {});

            for (let i = 0; i < total; i++) {
                const p = bePosOf(i);
                const within = i % B_PER_LAYER;
                const isLastOfLayer = (within === B_PER_LAYER - 1);
                let facingJava;
                if (isLastOfLayer) facingJava = 'up';
                else if (i === total - 1) facingJava = 'east';
                else facingJava = beFacingOf(p, bePosOf(i + 1));
                const facingDir = facingToBE(facingJava);

                const e = cmdEntries[i];
                let blockName;
                if (e.type === 'pulse') blockName = 'minecraft:command_block';
                else if (e.type === 'repeat') blockName = 'minecraft:repeating_command_block';
                else blockName = 'minecraft:chain_command_block';

                const auto = (e.type === 'chain') ? 1 : 0;
                const tickDelay = e.tickDelay || 0;

                const stateIdx = getPaletteIdx(blockName, {
                    facing_direction: facingDir,
                    conditional_bit: 0
                });
                const flatIdx = p.x * sizeY * sizeZ + p.y * sizeZ + p.z;
                blockIndices[flatIdx] = stateIdx;

                blockPositionData.set(String(flatIdx), [
                    { name: 'block_entity_data', type: 10, value: [
                        { name: 'id', type: 8, value: 'CommandBlock' },
                        { name: 'Command', type: 8, value: e.cmd },
                        { name: 'CustomName', type: 8, value: '' },
                        { name: 'ExecuteOnFirstTick', type: 1, value: 0 },
                        { name: 'LPCommandMode', type: 3, value: 0 },
                        { name: 'LPCondionalMode', type: 1, value: 0 },
                        { name: 'LPRedstoneMode', type: 1, value: 0 },
                        { name: 'LastExecution', type: 4, value: -1 },
                        { name: 'LastOutput', type: 8, value: '' },
                        { name: 'LastOutputParams', type: 9, value: { itemType: 8, items: [] } },
                        { name: 'SuccessCount', type: 3, value: 0 },
                        { name: 'TickDelay', type: 3, value: tickDelay },
                        { name: 'TrackOutput', type: 1, value: 1 },
                        { name: 'Version', type: 3, value: 34 },
                        { name: 'auto', type: 1, value: auto },
                        { name: 'conditionalMode', type: 1, value: 0 },
                        { name: 'conditionMet', type: 1, value: 0 },
                        { name: 'powered', type: 1, value: 0 }
                    ]}
                ]);
            }

            const paletteEntries = palette.map(e => [
                { name: 'name', type: 8, value: e.name },
                { name: 'states', type: 10, value: Object.entries(e.states).map(([k, v]) => ({
                    name: k,
                    type: Number.isInteger(v) ? 3 : 5,
                    value: v
                })) },
                { name: 'version', type: 3, value: e.version }
            ]);

            const bpEntries = [];
            for (const [k, v] of blockPositionData) {
                bpEntries.push({ name: k, type: 10, value: v });
            }

            const structureTag = [
                { name: 'block_indices', type: 9, value: { itemType: 9, items: [
                    { itemType: 3, items: blockIndices },
                    { itemType: 3, items: new Array(totalBlocks).fill(-1) }
                ] } },
                { name: 'entities', type: 9, value: { itemType: 10, items: [] } },
                { name: 'palette', type: 10, value: [
                    { name: 'default', type: 10, value: [
                        { name: 'block_palette', type: 9, value: { itemType: 10, items: paletteEntries } },
                        { name: 'block_position_data', type: 10, value: bpEntries }
                    ] }
                ] }
            ];

            const root = [
                { name: 'format_version', type: 3, value: 1 },
                { name: 'size', type: 9, value: { itemType: 3, items: [sizeX, sizeY, sizeZ] } },
                { name: 'structure', type: 10, value: structureTag },
                { name: 'structure_world_origin', type: 9, value: { itemType: 3, items: [0, 0, 0] } }
            ];

            const bytes = bSerializeBE(root);
            const blob = new Blob([bytes], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = randomName() + '.mcstructure';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setStatus('success', `结构导出成功！共 ${total} 个命令方块，尺寸 ${sizeX}×${sizeY}×${sizeZ}。`);
        }

        exportBEStructBtn.addEventListener('click', exportBEStructure);

        /* ==================== 基岩版结构导出 END ==================== */

        setStatus('info', '上传图片或视频，点击转换生成。');
        videoControls.classList.add('hidden');
        videoPreviewControls.classList.add('hidden');
    })();
</script>
