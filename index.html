<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字符画生成器 · Minecraft BE by ZeroRaltal</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0e1014;--surface:#14181e;--surface-2:#1a1f27;--surface-3:#222831;
  --surface-hover:#262d38;--border:#232a34;--border-strong:#313a47;
  --text:#e6e9ee;--text-dim:#8b95a5;--text-mute:#5a6474;
  --accent:#5eead4;--accent-hover:#7ff0dd;
  --accent-soft:rgba(94,234,212,0.10);--accent-border:rgba(94,234,212,0.35);
  --danger:#ef6b6b;--warn:#f5c452;
  --radius-sm:6px;--radius:10px;--radius-lg:16px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Courier New",monospace;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(94,234,212,0.07),transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--text);font-family:var(--font-sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:4px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--border-strong)}
.app{max-width:920px;margin:0 auto;padding:40px 20px 60px}
.header{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.header-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;
  background:var(--accent-soft);border:1px solid var(--accent-border);color:var(--accent);flex-shrink:0}
.header-icon svg{width:24px;height:24px}
.header-text h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-0.01em}
.header-text p{margin:1px 0 0;font-size:13px;color:var(--text-dim)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  margin-bottom:16px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border)}
.card-step{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);padding:2px 8px;border-radius:5px;letter-spacing:.05em;flex-shrink:0}
.card-head h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-0.005em}
.card-meta{margin-left:auto;font-size:11px;font-family:var(--font-mono);color:var(--text-mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-body{padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;
  font-family:inherit;font-size:13px;font-weight:500;line-height:1;border:1px solid transparent;
  border-radius:var(--radius);cursor:pointer;white-space:nowrap;user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s,border-color .15s,color .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(0.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{flex-shrink:0}
.btn-primary{background:var(--accent);color:#0e1014;font-weight:600}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-primary.stop{background:var(--danger);color:#fff}
.btn-primary.stop:hover:not(:disabled){background:#f58484}
.btn-secondary{background:var(--surface-2);border-color:var(--border-strong);color:var(--text)}
.btn-secondary:hover:not(:disabled){background:var(--surface-hover);border-color:var(--accent-border);color:var(--accent)}
.upload-row{display:flex;gap:10px;align-items:stretch;margin-bottom:18px}
.upload-row input[type="file"]{flex:1;min-width:0;background:var(--surface-2);
  border:1px dashed var(--border-strong);border-radius:var(--radius);padding:11px 14px;
  color:var(--text-dim);font-family:inherit;font-size:13px;cursor:pointer;
  transition:border-color .15s,background .15s}
.upload-row input[type="file"]:hover{border-color:var(--accent-border);background:var(--surface-3)}
.upload-row input[type="file"]::file-selector-button{background:var(--surface-3);
  border:1px solid var(--border-strong);color:var(--text);padding:5px 12px;border-radius:var(--radius-sm);
  font-family:inherit;font-size:12px;cursor:pointer;margin-right:12px;transition:all .15s}
.upload-row input[type="file"]::file-selector-button:hover{background:var(--surface-hover);
  border-color:var(--accent-border);color:var(--accent)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.setting{display:flex;flex-direction:column;gap:6px;min-width:0}
.setting-label{font-size:12px;font-weight:500;color:var(--text-dim);letter-spacing:.01em}
.setting-control{display:flex;align-items:center;gap:10px;min-height:32px}
.setting-control input[type="range"]{flex:1;min-width:0}
.setting-value{font-family:var(--font-mono);font-size:12px;color:var(--accent);min-width:42px;
  text-align:right;flex-shrink:0}
.setting-hint{font-size:11px;color:var(--text-mute);font-family:var(--font-mono);white-space:nowrap}
input[type="range"]{-webkit-appearance:none;appearance:none;background:transparent;height:16px;cursor:pointer;margin:0}
input[type="range"]::-webkit-slider-runnable-track{height:4px;background:var(--surface-3);border-radius:2px}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;
  border-radius:50%;background:var(--accent);border:none;margin-top:-5px;transition:transform .12s}
input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type="range"]::-moz-range-track{height:4px;background:var(--surface-3);border-radius:2px}
input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:none}
select{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
  padding:8px 30px 8px 11px;border-radius:var(--radius-sm);font-family:inherit;font-size:12.5px;
  cursor:pointer;appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b95a5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:14px;transition:border-color .15s}
select:hover{border-color:var(--accent-border)}
select:focus{outline:none;border-color:var(--accent-border)}
select option{background:var(--surface-2);color:var(--text)}
input[type="number"]{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
  padding:7px 10px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:12.5px;width:68px;
  transition:border-color .15s}
input[type="number"]:focus{outline:none;border-color:var(--accent-border)}
#videoControls{padding:16px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:18px}
#videoControls .settings{margin-bottom:14px}
.progress{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-bottom:10px}
.progress-fill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .2s}
.info-row{font-size:11.5px;color:var(--text-mute);font-family:var(--font-mono);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* ==================== 预览区：16:9 拉伸铺满，无滚动条 ==================== */
.preview-box{
  position: relative;
  background:#090b0e;
  border:1px solid var(--border);
  border-radius: var(--radius);
  padding:14px;
  overflow:hidden;
  aspect-ratio: 16 / 9;
}
.preview-box pre{
  position:absolute;
  top:50%;
  left:50%;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  margin:0;
  font-family: var(--font-mono);
  line-height:1;
  white-space:pre;
  font-size:12px;                /* JS 覆盖 */
  color: var(--text-dim);
  will-change: transform;
}
.preview-box pre.placeholder{
  font-family: var(--font-sans);
  font-size:13px;
  color: var(--text-mute);
  white-space:normal;
  text-align:center;
  line-height:1.5;
  max-width:80%;
  transform: translate(-50%, -50%);
}
.preview-controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--border)}
.preview-controls .icon-btn{width:32px;height:32px;padding:0}
.preview-controls .progress-sm{flex:1;min-width:100px;height:5px;background:var(--surface-3);
  border-radius:3px;cursor:pointer;position:relative;overflow:hidden}
.preview-controls .progress-fill-sm{height:100%;width:0;background:var(--accent);border-radius:3px;
  pointer-events:none;transition:width .1s linear}
.preview-controls .frame-info{font-size:11px;font-family:var(--font-mono);color:var(--text-dim);
  min-width:62px;text-align:center}
.preview-controls input[type="range"]{width:76px;flex:none}
.preview-controls .speed-value{font-size:11px;font-family:var(--font-mono);color:var(--accent);min-width:30px}
.preview-controls .ctrl-label{font-size:11px;color:var(--text-mute)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;
  border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-dim);
  border-radius:var(--radius-sm);cursor:pointer;flex-shrink:0;transition:all .15s}
.icon-btn:hover{background:var(--surface-hover);color:var(--accent);border-color:var(--accent-border)}
.icon-btn svg{width:14px;height:14px}
.status{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius);
  font-size:12.5px;margin-bottom:14px;border:1px solid;line-height:1.4;word-break:break-word}
.status svg{flex-shrink:0;width:16px;height:16px}
.status.info{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent)}
.status.success{background:rgba(94,234,212,0.08);border-color:rgba(94,234,212,0.3);color:var(--accent)}
.status.warn{background:rgba(245,196,82,0.06);border-color:rgba(245,196,82,0.25);color:var(--warn)}
.status.error{background:rgba(239,107,107,0.06);border-color:rgba(239,107,107,0.25);color:var(--danger)}
.status.clock{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent)}
.output-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cmd-list{display:flex;flex-direction:column;gap:6px;max-height:380px;overflow-y:auto;padding-right:2px}
.cmd-list:empty::before{content:"暂无命令，请先转换素材";display:block;padding:20px;text-align:center;
  color:var(--text-mute);font-size:12.5px}
.cmd-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);transition:border-color .15s}
.cmd-item:hover{border-color:var(--border-strong)}
.cmd-item .seq{font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:2px 7px;border-radius:4px;flex-shrink:0;min-width:30px;text-align:center}
.cmd-item .label{flex:1;font-size:12.5px;color:var(--text-dim);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.footer{text-align:center;font-size:11.5px;color:var(--text-mute);font-family:var(--font-mono);
  margin-top:32px;letter-spacing:.04em}
.hidden{display:none !important}
@media (max-width:560px){
  .app{padding:24px 14px 48px}
  .card-head{padding:14px 16px}
  .card-body{padding:16px}
  .upload-row{flex-direction:column}
  .upload-row .btn{width:100%}
  .header-icon{width:40px;height:40px}
  .header-icon svg{width:20px;height:20px}
  .header-text h1{font-size:17px}
  .header-text p{font-size:12px}
  .output-actions .btn{flex:1 1 auto}
  .preview-box{padding:10px}
}
</style>
</head>
<body>
<div class="app">

<header class="header">
  <div class="header-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="9" cy="9" r="1.6" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="9" r="1.6" fill="currentColor" stroke="none"/>
      <path d="M6 17l3.5-3.5 2.5 2.5 3-3L18 16"/>
    </svg>
  </div>
  <div class="header-text">
    <h1>字符画生成器</h1>
    <p>Minecraft BE 1.19+ · 图片 / 视频 转 命令方块字符画</p>
  </div>
</header>

<section class="card">
  <div class="card-head">
    <span class="card-step">01</span>
    <h2>选择素材</h2>
    <span class="card-meta" id="sizeHint">128×32 · 27 色 · 抖动</span>
  </div>
  <div class="card-body">
    <div class="upload-row">
      <input type="file" id="fileInput" accept="image/*,video/*">
      <button class="btn btn-primary" id="convertBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        转换并生成命令
      </button>
    </div>

    <div id="videoControls" class="hidden">
      <div class="settings">
        <div class="setting">
          <label class="setting-label" for="fpsSlider">帧率 (FPS)</label>
          <div class="setting-control">
            <input type="range" id="fpsSlider" min="1" max="20" value="20" step="1">
            <span class="setting-value" id="fpsValue">20</span>
          </div>
        </div>
        <div class="setting">
          <label class="setting-label" for="delayInput">循环延迟 (tick)</label>
          <div class="setting-control">
            <input type="number" id="delayInput" value="1" min="1" max="20" step="1">
            <span class="setting-hint">自动 = 20 / FPS</span>
          </div>
        </div>
      </div>
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div class="info-row" id="videoInfo">未加载视频</div>
    </div>

    <div class="settings" style="margin-top:18px;">
      <div class="setting">
        <label class="setting-label" for="ditherRange">抖动范围</label>
        <div class="setting-control">
          <input type="range" id="ditherRange" min="0" max="150" step="5" value="100">
          <span class="setting-value" id="ditherValue">100%</span>
        </div>
      </div>
      <div class="setting">
        <label class="setting-label" for="charVersion">显示版本</label>
        <div class="setting-control">
          <select id="charVersion">
            <option value="international">国际版 (128 字符/行)</option>
            <option value="netease">网易版 (192 字符/行 + 32 空格缩进)</option>
          </select>
        </div>
      </div>
      <div class="setting">
        <label class="setting-label" for="cmdMode">命令模式</label>
        <div class="setting-control">
          <select id="cmdMode">
            <option value="titleraw">titleraw actionbar(物品栏上方)</option>
            <option value="tellraw">tellraw(聊天栏)</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="card">
  <div class="card-head">
    <span class="card-step">02</span>
    <h2>预览</h2>
  </div>
  <div class="card-body">
    <div class="preview-box" id="previewBox">
      <pre id="previewPre" class="placeholder">上传图片或视频后点击转换</pre>
    </div>
    <div id="videoPreviewControls" class="preview-controls hidden">
      <button class="icon-btn" id="playPauseBtn" title="播放 / 暂停">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>
      </button>
      <div class="progress-sm" id="previewProgressBar">
        <div class="progress-fill-sm" id="previewProgressFill"></div>
      </div>
      <span class="frame-info" id="frameInfo">0 / 0</span>
      <span class="ctrl-label">速度</span>
      <input type="range" id="previewSpeedSlider" min="0.5" max="3.0" step="0.1" value="1.0">
      <span class="speed-value" id="previewSpeedValue">1.0x</span>
      <button class="icon-btn" id="loopBtn" title="循环播放">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
          <path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
    </div>
  </div>
</section>

<section class="card">
  <div class="card-head">
    <span class="card-step">03</span>
    <h2>输出命令</h2>
  </div>
  <div class="card-body">
    <div class="status info" id="statusMsg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <span>上传图片或视频，点击转换生成。</span>
    </div>

    <div class="output-actions">
      <button class="btn btn-secondary" id="copyAllBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        复制全部
      </button>
      <button class="btn btn-secondary" id="downloadBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        下载 .txt
      </button>
      <button class="btn btn-secondary" id="exportBEStructBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"/>
          <polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
        </svg>
        导出结构 (.mcstructure)
      </button>
      <button class="btn btn-secondary" id="exportMcWorldBtn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/>
        </svg>
        导出存档 (.mcworld)
      </button>
    </div>

    <div class="cmd-list" id="commandList"></div>
  </div>
</section>

<footer class="footer">@ ZeroRaltal</footer>
</div>

<script>
(function() {
    "use strict";

    const ICONS = {
        play: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>',
        pause: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
        stop: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
        copy: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
        check: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        clock: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>',
        warn: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.6L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
        error: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        info: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };

    function hexToRgb(hex) {
        const n = parseInt(hex.replace('#',''), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    const colorData = [
        {code:'0',hex:'#000000',isGray:true},{code:'1',hex:'#0000AA',isGray:false},
        {code:'2',hex:'#00AA00',isGray:false},{code:'3',hex:'#00AAAA',isGray:false},
        {code:'4',hex:'#AA0000',isGray:false},{code:'5',hex:'#AA00AA',isGray:false},
        {code:'6',hex:'#FFAA00',isGray:false},{code:'7',hex:'#C5C5C5',isGray:true},
        {code:'8',hex:'#545454',isGray:true},{code:'9',hex:'#5454FF',isGray:false},
        {code:'a',hex:'#54FF54',isGray:false},{code:'b',hex:'#54FFFF',isGray:false},
        {code:'c',hex:'#FF5454',isGray:false},{code:'d',hex:'#D747D7',isGray:false},
        {code:'e',hex:'#FFFF54',isGray:false},{code:'f',hex:'#FFFFFF',isGray:true},
        {code:'g',hex:'#C2A712',isGray:false},{code:'h',hex:'#E2D3D1',isGray:false},
        {code:'i',hex:'#CEC9C9',isGray:false},{code:'j',hex:'#44393A',isGray:false},
        {code:'m',hex:'#961506',isGray:false},{code:'n',hex:'#B4684D',isGray:false},
        {code:'p',hex:'#DEB02C',isGray:false},{code:'q',hex:'#119F36',isGray:false},
        {code:'s',hex:'#2CB9A8',isGray:false},{code:'t',hex:'#20487A',isGray:false},
        {code:'u',hex:'#9A5CC5',isGray:false}
    ];

    const COLORS = colorData.map(c => ({code:c.code,hex:c.hex,rgb:hexToRgb(c.hex),isGray:c.isGray}));
    const COLOR_BY_CODE = Object.fromEntries(COLORS.map(c => [c.code, c.hex]));

    const LUT_BITS=5,LUT_SHIFT=8-LUT_BITS,LUT_SIZE=1<<(LUT_BITS*3),LUT_MASK=(1<<LUT_BITS)-1;
    const LUT_R_SHIFT=LUT_BITS*2,LUT_G_SHIFT=LUT_BITS;
    let lutIndex=null;

    const PAL_R=new Float32Array(COLORS.length);
    const PAL_G=new Float32Array(COLORS.length);
    const PAL_B=new Float32Array(COLORS.length);
    const PAL_GRAY=new Uint8Array(COLORS.length);
    for(let i=0;i<COLORS.length;i++){
        PAL_R[i]=COLORS[i].rgb[0];PAL_G[i]=COLORS[i].rgb[1];PAL_B[i]=COLORS[i].rgb[2];
        PAL_GRAY[i]=COLORS[i].isGray?1:0;
    }

    function buildColorLUT(){
        const n=COLORS.length;
        const idx=new Uint8Array(LUT_SIZE);
        const mid=4;let p=0;
        for(let r5=0;r5<=LUT_MASK;r5++){
            const r=(r5<<LUT_SHIFT)+mid;
            for(let g5=0;g5<=LUT_MASK;g5++){
                const g=(g5<<LUT_SHIFT)+mid;
                for(let b5=0;b5<=LUT_MASK;b5++,p++){
                    const b=(b5<<LUT_SHIFT)+mid;
                    const mx=r>g?(r>b?r:b):(g>b?g:b);
                    const mn=r<g?(r<b?r:b):(g<b?g:b);
                    const isGray=(mx-mn)<25;
                    let best=0,bestDist=Infinity;
                    for(let i=0;i<n;i++){
                        const dr=r-PAL_R[i],dg=g-PAL_G[i],db=b-PAL_B[i];
                        let d=0.299*dr*dr+0.587*dg*dg+0.114*db*db;
                        if(PAL_GRAY[i]&&!isGray)d*=1.0;
                        if(d<bestDist){bestDist=d;best=i;}
                    }
                    idx[p]=best;
                }
            }
        }
        lutIndex=idx;
    }
    function ensureLUT(){ if(lutIndex===null) buildColorLUT(); }

    let ditherBuffer=null,workCanvas=null;
    const CHAR_WIDTH_INTL=128,CHAR_WIDTH_NETEASE=192,CHAR_HEIGHT=32;
    let charWidth=CHAR_WIDTH_INTL,charHeight=CHAR_HEIGHT;

    // 网易版每行前缀：32 个空格
    const NETEASE_LINE_PREFIX = ' '.repeat(20);

    function getWorkCanvas(){
        if(!workCanvas||workCanvas.width!==charWidth||workCanvas.height!==charHeight){
            workCanvas=document.createElement('canvas');
            workCanvas.width=charWidth;
            workCanvas.height=charHeight;
            workCanvas.__ditherCtx=workCanvas.getContext('2d',{willReadFrequently:true});
        }
        return workCanvas;
    }

    // ditherStrength: 0.0 ~ 1.5
    function canvasToCharArtWithDithering(canvas, ditherStrength){
        const W=charWidth,H=charHeight;
        const ctx=canvas.__ditherCtx||(canvas.__ditherCtx=canvas.getContext('2d',{willReadFrequently:true}));
        const imgData=ctx.getImageData(0,0,W,H);
        const data=imgData.data;
        const len=data.length;
        if(!ditherBuffer||ditherBuffer.length!==len)ditherBuffer=new Float32Array(len);
        const pixels=ditherBuffer;
        pixels.set(data);
        ensureLUT();
        const lut=lutIndex;
        const LSH=LUT_SHIFT,RSH=LUT_R_SHIFT,GSH=LUT_G_SHIFT;
        const dS = ditherStrength;
        let charArt='§l';
        let lastCode=null;
        const rowStride=W*4;
        for(let row=0;row<H;row++){
            const rowOff=row*rowStride;
            for(let col=0;col<W;col++){
                const idx=rowOff+col*4;
                let r=pixels[idx],g=pixels[idx+1],b=pixels[idx+2];
                if(r<0)r=0;else if(r>255)r=255;
                if(g<0)g=0;else if(g>255)g=255;
                if(b<0)b=0;else if(b>255)b=255;
                const ci=lut[((r>>LSH)<<RSH)|((g>>LSH)<<GSH)|(b>>LSH)];
                const color=COLORS[ci];
                const code=color.code;
                if(code!==lastCode){charArt+='§'+code;lastCode=code;}
                charArt+='|';
                const er=(r-color.rgb[0])*dS;
                const eg=(g-color.rgb[1])*dS;
                const eb=(b-color.rgb[2])*dS;
                if(col+1<W){
                    const n=idx+4;
                    pixels[n]+=er*0.4375;pixels[n+1]+=eg*0.4375;pixels[n+2]+=eb*0.4375;
                }
                if(row+1<H){
                    const nextOff=rowOff+rowStride;
                    if(col>0){
                        const n=nextOff+(col-1)*4;
                        pixels[n]+=er*0.1875;pixels[n+1]+=eg*0.1875;pixels[n+2]+=eb*0.1875;
                    }
                    {
                        const n=nextOff+col*4;
                        pixels[n]+=er*0.3125;pixels[n+1]+=eg*0.3125;pixels[n+2]+=eb*0.3125;
                    }
                    if(col+1<W){
                        const n=nextOff+(col+1)*4;
                        pixels[n]+=er*0.0625;pixels[n+1]+=eg*0.0625;pixels[n+2]+=eb*0.0625;
                    }
                }
            }
            if(row<H-1){charArt+='\n';lastCode=null;}
        }
        return charArt;
    }

    // 网易版：每一行最前方插入 32 个空格（预览不加）
    function getLinePrefix(){
        return (charVersionSelect.value === 'netease') ? NETEASE_LINE_PREFIX : '';
    }

    function buildSingleCommand(charArt, mode, linePrefix){
        let text = charArt;
        if(linePrefix){
            text = linePrefix + text.replace(/\n/g, '\n' + linePrefix);
        }
        if(mode==='titleraw') text += '\n'.repeat(16);
        const escaped = text.replace(/\n/g,'\\n');
        const json = `{"rawtext":[{"text":"${escaped}"}]}`;
        if(mode==='tellraw') return `tellraw @a ${json}`;
        return `titleraw @a actionbar ${json}`;
    }

    function renderPreview(charArt){
        const parts = [];
        const n = charArt.length;
        let i = 0;
        let currentHex = '#FFFFFF';
        while (i < n) {
            const ch = charArt[i];
            if (ch === '§' && i + 1 < n) {
                const code = charArt[i + 1];
                const hex = COLOR_BY_CODE[code];
                if (hex) currentHex = hex;
                i += 2;
                // 收集同色连续字符，直到下一个 § 或换行
                let end = i;
                while (end < n && charArt[end] !== '§' && charArt[end] !== '\n') end++;
                if (end > i) {
                    parts.push(`<span style="color:${currentHex};">${charArt.substring(i, end)}</span>`);
                }
                i = end;
                continue;
            }
            if (ch === '\n') { parts.push('\n'); i++; continue; }
            parts.push(ch);
            i++;
        }
        return parts.join('');
    }

    /* ============================================================
       预览自适应：16:9 容器内文字同时铺满宽高（允许非等比拉伸）
       - font-size 决定水平方向刚好填满
       - scaleY 补偿垂直方向，让内容恰好铺满高度
       ============================================================ */
    let _fitCacheKey = '';
    let _charWidthRatio = null;
    let _measuredFontFamily = null;

    function measureCharWidthRatio(){
        if(!previewPre) return 0.6;
        const ff = getComputedStyle(previewPre).fontFamily;
        if(_charWidthRatio !== null && _measuredFontFamily === ff){
            return _charWidthRatio;
        }
        const probe = document.createElement('span');
        probe.style.position = 'absolute';
        probe.style.left = '-9999px';
        probe.style.top = '-9999px';
        probe.style.visibility = 'hidden';
        probe.style.whiteSpace = 'pre';
        probe.style.fontFamily = ff;
        probe.style.fontSize = '100px';
        probe.style.lineHeight = '1';
        probe.textContent = '|';
        document.body.appendChild(probe);
        const w = probe.getBoundingClientRect().width;
        document.body.removeChild(probe);
        _charWidthRatio = (w > 0 ? w : 60) / 100;
        _measuredFontFamily = ff;
        return _charWidthRatio;
    }

    function fitPreviewFontSize(){
        if(!previewPre || !previewBox) return;

        // 占位符状态：恢复默认
        if(previewPre.classList.contains('placeholder')){
            previewPre.style.fontSize = '';
            previewPre.style.lineHeight = '';
            previewPre.style.transform = '';
            _fitCacheKey = '';
            return;
        }

        const cs = getComputedStyle(previewBox);
        const padL = parseFloat(cs.paddingLeft) || 0;
        const padR = parseFloat(cs.paddingRight) || 0;
        const padT = parseFloat(cs.paddingTop) || 0;
        const padB = parseFloat(cs.paddingBottom) || 0;
        const availW = previewBox.clientWidth  - padL - padR;
        const availH = previewBox.clientHeight - padT - padB;
        if(availW <= 0 || availH <= 0) return;

        const cols = Math.max(1, charWidth);
        const rows = Math.max(1, charHeight);
        const key = availW + '|' + availH + '|' + cols + '|' + rows;
        if(key === _fitCacheKey) return;
        _fitCacheKey = key;

        const ratio = measureCharWidthRatio();

        // 先让宽度刚好铺满：fontSize = availW / (cols * charRatio)
        let fontSize = availW / cols / ratio;
        if(!isFinite(fontSize) || fontSize <= 0) fontSize = 12;
        if(fontSize < 0.5)  fontSize = 0.5;
        if(fontSize > 200)  fontSize = 200;

        previewPre.style.fontSize = fontSize + 'px';
        previewPre.style.lineHeight = '1';

        // 垂直方向拉伸：让 rows 行 × fontSize 的高度铺满 availH
        const naturalH = rows * fontSize;
        let scaleY = availH / naturalH;
        if(!isFinite(scaleY) || scaleY <= 0) scaleY = 1;

        previewPre.style.transform = `translate(-50%, -50%) scaleY(${scaleY})`;
    }

    function setPreviewPlaceholder(text){
        previewPre.className='placeholder';
        previewPre.textContent=text;
        previewPre.style.fontSize='';
        previewPre.style.lineHeight='';
        previewPre.style.transform='';
        _fitCacheKey='';
    }

    function setPreviewHTML(html){

    function setStatus(type,msg){

    /* ========== 缩略图工具 ========== */
    const THUMB_W=800,THUMB_H=450;

    function makeThumbnailCanvas(src,srcW,srcH){
        const canvas=document.createElement('canvas');
        canvas.width=THUMB_W;
        canvas.height=THUMB_H;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#000000';
        ctx.fillRect(0,0,THUMB_W,THUMB_H);
        if(!src||!srcW||!srcH)return canvas;
        const scale=Math.max(THUMB_W/srcW,THUMB_H/srcH);
        const dw=srcW*scale;
        const dh=srcH*scale;
        const dx=(THUMB_W-dw)/2;
        const dy=(THUMB_H-dh)/2;
        try{
            ctx.imageSmoothingEnabled=true;
            ctx.imageSmoothingQuality='high';
            ctx.drawImage(src,dx,dy,dw,dh);
        }catch(e){
            console.warn('缩略图绘制失败:',e);
        }
        return canvas;
    }

    async function processImage(file){
        if(isProcessing)return;
        isProcessing=true;
        convertBtn.disabled=true;
        convertBtn.innerHTML=`${ICONS.clock} 处理中...`;
        setStatus('clock','正在处理图片...');
        try{
            const ditherStrength=parseFloat(ditherRangeSlider.value)/100;
            const mode=cmdModeSelect.value;
            const img=await loadImage(file);

            if(img.naturalWidth>0&&img.naturalHeight>0){
                thumbnailCanvas=makeThumbnailCanvas(img,img.naturalWidth,img.naturalHeight);
            }

            const canvas=getWorkCanvas();
            const ctx=canvas.__ditherCtx;
            ctx.clearRect(0,0,charWidth,charHeight);
            ctx.imageSmoothingEnabled=true;
            ctx.drawImage(img,0,0,charWidth,charHeight);
            const charArt=canvasToCharArtWithDithering(canvas,ditherStrength);
            const singleCmd=buildSingleCommand(charArt,mode,getLinePrefix());
            imageData={charArt,singleCmd};
            currentMode='image';
            setPreviewHTML(renderPreview(charArt));
            videoControls.classList.add('hidden');
            videoPreviewControls.classList.add('hidden');
            commandList.innerHTML=`
                <div class="cmd-item">

                </div>

    async function processVideo(file){
        if(isProcessing)return;
        isProcessing=true;
        stopRequested=false;
        convertBtn.disabled=false;
        convertBtn.innerHTML=`${ICONS.stop} 停止`;
        convertBtn.classList.add('stop');
        setStatus('clock','正在加载视频...');
        progressFill.style.width='0%';
        videoControls.classList.remove('hidden');
        try{
            const ditherStrength=parseFloat(ditherRangeSlider.value)/100;
            const mode=cmdModeSelect.value;
            const fps=parseInt(fpsSlider.value);
            let delay=parseInt(delayInput.value);
            if(isNaN(delay)||delay<1)delay=1;
            if(delay>20)delay=20;
            delayInput.value=delay;
            const video=await loadVideo(file);
            const duration=video.duration;
            if(!duration||duration<=0)throw new Error('无法获取视频时长');
            const totalFrames=Math.floor(duration*fps);
            if(totalFrames<1)throw new Error('视频时长太短或帧率太低，无有效帧');
            videoInfo.textContent=`时长 ${duration.toFixed(2)}s · 帧率 ${fps} FPS · 总帧数 ${totalFrames}`;

            // 缩略图：视频第 2 秒帧；时长不足 2 秒则取最后一帧
            try{
                const thumbTime = (duration >= 2) ? 2 : Math.max(0, duration - 0.001);
                await seekVideo(video, thumbTime);
                if(video.videoWidth>0 && video.videoHeight>0){
                    thumbnailCanvas=makeThumbnailCanvas(video, video.videoWidth, video.videoHeight);
                }
            }catch(thumbErr){
                console.warn('视频缩略图抓取失败:', thumbErr);
            }

            const canvas=getWorkCanvas();
            const ctx=canvas.__ditherCtx;
            ctx.imageSmoothingEnabled=true;
            const allCharArts=new Array(totalFrames);
            let failedFrames=0;
            for(let i=1;i<=totalFrames;i++){
                if(stopRequested){
                    setStatus('warn','已停止处理。');
                    progressFill.style.width='0%';
                    videoInfo.textContent='已停止';
                    return;
                }
                const time=Math.min(i/fps,duration-0.001);
                try{
                    await seekVideo(video,time);
                    ctx.drawImage(video,0,0,charWidth,charHeight);
                    allCharArts[i-1]=canvasToCharArtWithDithering(canvas,ditherStrength);
                }catch(seekErr){
                    failedFrames++;
                    allCharArts[i-1]='';
                }
                if((i%20)===0||i===totalFrames){
                    progressFill.style.width=((i/totalFrames)*100)+'%';
                    setStatus('clock',`处理帧 ${i}/${totalFrames}（跳过 ${failedFrames} 帧）`);
                    await new Promise(r=>setTimeout(r,0));
                }
            }
            videoFrameData={allCharArts,totalFrames,fps,failedFrames};
            currentMode='video';
            generateVideoCommands(videoFrameData,mode,delay);
            initVideoPreview(videoFrameData);
            if(allCharArts.length>0&&allCharArts[0]){
                setPreviewHTML(renderPreview(allCharArts[0]));
            }else{
                setPreviewPlaceholder('无有效帧');
            }
            setStatus('success',`视频处理完成！有效帧 ${totalFrames-failedFrames}，延迟 ${delay} tick。`);
            progressFill.style.width='100%';
        }catch(err){
            setStatus('error',err.message);
            console.error(err);
        }finally{
            isProcessing=false;
            convertBtn.disabled=false;
            convertBtn.innerHTML=`${ICONS.check} 转换并生成命令`;
            convertBtn.classList.remove('stop');
            stopRequested=false;
        }
    }

    function generateVideoCommands(data,mode,delay){

        let allCmds=[];
        const prefix=getLinePrefix();
        const headerCmds=[

    let previewTimer=null,currentFrameIndex=0,isPlaying=false,loopEnabled=false;

    function initVideoPreview(data){
        if(!data||!data.allCharArts||data.allCharArts.length===0){
            videoPreviewControls.classList.add('hidden');return;
        }
        previewFrames=data.allCharArts.filter(c=>c!=='');

            videoPreviewControls.classList.add('hidden');return;
        }
        previewFps=data.fps||1;
        currentFrameIndex=0;isPlaying=false;
        if(previewTimer){clearInterval(previewTimer);previewTimer=null;}
        videoPreviewControls.classList.remove('hidden');
        updatePreviewFrame(0);
        frameInfo.textContent=`1 / ${previewFrames.length}`;
        previewProgressFill.style.width='0%';

        const oldPlayBtn=document.getElementById('playPauseBtn');
        const oldLoopBtn=document.getElementById('loopBtn');
        const playBtn=oldPlayBtn.cloneNode(true);
        oldPlayBtn.parentNode.replaceChild(playBtn,oldPlayBtn);
        const loopBtnEl=oldLoopBtn.cloneNode(true);

        const progBar=document.getElementById('previewProgressBar');
        const progFill=document.getElementById('previewProgressFill');
        const frameInfoEl=document.getElementById('frameInfo');
        const speedSlider=document.getElementById('previewSpeedSlider');
        const speedVal=document.getElementById('previewSpeedValue');

        playBtn.addEventListener('click',function(){
            if(isPlaying)pausePreview();else playPreview();
        });

        let isDraggingPreview=false;
        function seekPreviewAt(clientX){
            const rect=progBar.getBoundingClientRect();
            const x=(clientX-rect.left)/rect.width;
            const idx=Math.floor(x*previewFrames.length);
            if(idx>=0&&idx<previewFrames.length){
                currentFrameIndex=idx;
                updatePreviewFrame(idx);
            }
        }
        progBar.addEventListener('mousedown',function(e){isDraggingPreview=true;seekPreviewAt(e.clientX);});
        window.addEventListener('mousemove',function(e){if(isDraggingPreview)seekPreviewAt(e.clientX);});
        window.addEventListener('mouseup',function(){
            if(isDraggingPreview){
                isDraggingPreview=false;
                if(isPlaying){pausePreview();playPreview();}
            }
        });
        speedSlider.addEventListener('input',function(){
            const val=parseFloat(this.value);
            speedVal.textContent=val.toFixed(1)+'x';
            if(isPlaying){pausePreview();playPreview();}
        });
        loopBtnEl.addEventListener('click',function(){
            loopEnabled=!loopEnabled;
            this.style.background=loopEnabled?'rgba(94,234,212,0.15)':'';
            this.style.borderColor=loopEnabled?'var(--accent-border)':'';
            this.style.color=loopEnabled?'var(--accent)':'';
        });
    }

    function updatePreviewFrame(index){
        if(index<0||index>=previewFrames.length)return;
        setPreviewHTML(renderPreview(previewFrames[index]));
        const progFill=document.getElementById('previewProgressFill');
        if(progFill)progFill.style.width=(index/Math.max(1,previewFrames.length-1))*100+'%';
        const frameInfoEl=document.getElementById('frameInfo');
        if(frameInfoEl)frameInfoEl.textContent=`${index+1} / ${previewFrames.length}`;
    }

    function playPreview(){
        if(isPlaying)return;
        if(currentFrameIndex>=previewFrames.length-1){currentFrameIndex=0;updatePreviewFrame(0);}
        isPlaying=true;
        const pb=document.getElementById('playPauseBtn');
        if(pb)pb.innerHTML=ICONS.pause;
        const speed=parseFloat(document.getElementById('previewSpeedSlider').value);
        const interval=1000/(previewFps*speed);

        function scheduleNext(){
            if(!isPlaying) return;
            previewTimer=setTimeout(()=>{
                if(!isPlaying) return;
                if(currentFrameIndex < previewFrames.length - 1){
                    currentFrameIndex++;
                    updatePreviewFrame(currentFrameIndex);
                    scheduleNext();
                } else {
                    if(loopEnabled){
                        currentFrameIndex = 0;
                        updatePreviewFrame(0);
                        scheduleNext();
                    } else {
                        pausePreview();
                    }
                }
            }, interval);
        }
        scheduleNext();
    }

    function pausePreview(){
        isPlaying=false;
        if(previewTimer){
            clearTimeout(previewTimer);
            clearInterval(previewTimer);  // 兼容旧逻辑
            previewTimer=null;
        }
        const pb=document.getElementById('playPauseBtn');
        if(pb)pb.innerHTML=ICONS.play;
    }

    function loadImage(file){
        return new Promise((resolve,reject)=>{
            const reader=new FileReader();
            reader.onload=(e)=>{
                const img=new Image();
                img.onload=()=>resolve(img);
                img.onerror=()=>reject(new Error('图片加载失败'));
                img.src=e.target.result;
            };
            reader.onerror=()=>reject(new Error('文件读取失败'));
            reader.readAsDataURL(file);
        });
    }

    function loadVideo(file){
        return new Promise((resolve,reject)=>{
            const url=URL.createObjectURL(file);
            const video=document.createElement('video');
            video.preload='auto';video.muted=true;video.playsInline=true;
            video.onloadedmetadata=()=>resolve(video);
            video.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('视频加载失败'));};
            video.src=url;
        });
    }

    function seekVideo(video,time){
        return new Promise((resolve)=>{
            if(Math.abs(video.currentTime-time)<0.005){resolve();return;}
            let resolved=false;
            const done=()=>{if(!resolved){resolved=true;video.onseeked=null;resolve();}};
            video.onseeked=done;
            try{video.currentTime=time;}catch(e){done();return;}
            setTimeout(done,1200);
        });
    }

        }).catch(()=>alert('复制失败'));
    }

    /* ========== NBT 基础函数（小端序，基岩版） ========== */
    function randomName(){
        const chars='abcdefghijklmnopqrstuvwxyz0123456789';
        let s='';
        for(let i=0;i<4;i++)s+=chars[Math.floor(Math.random()*chars.length)];
        return s;
    }
    function bPutU16(a,v){a.push(v&0xFF,(v>>8)&0xFF);}
    function bPutI32(a,v){a.push(v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF);}
    function bPutStr(a,s){
        const b=new TextEncoder().encode(s);
        bPutU16(a,b.length);
        for(let i=0;i<b.length;i++)a.push(b[i]);
    }
    function bPutTag(a,type,name,val){
        a.push(type);
        if(type===0)return;
        bPutStr(a,name);
        bPutVal(a,type,val);
    }
    function bPutVal(a,type,val){
        switch(type){
            case 1:a.push(val&0xFF);break;
            case 2:bPutU16(a,val);break;
            case 3:bPutI32(a,val);break;
            case 4:{
                const dv=new DataView(new ArrayBuffer(8));
                dv.setBigInt64(0,BigInt(val),true);
                const u=new Uint8Array(dv.buffer);
                for(let i=0;i<8;i++)a.push(u[i]);break;
            }
            case 5:{
                const dv=new DataView(new ArrayBuffer(4));
                dv.setFloat32(0,val,true);
                const u=new Uint8Array(dv.buffer);
                for(let i=0;i<4;i++)a.push(u[i]);break;
            }
            case 6:{
                const dv=new DataView(new ArrayBuffer(8));
                dv.setFloat64(0,val,true);
                const u=new Uint8Array(dv.buffer);
                for(let i=0;i<8;i++)a.push(u[i]);break;
            }
            case 7:bPutI32(a,val.length);for(let i=0;i<val.length;i++)a.push(val[i]&0xFF);break;
            case 8:bPutStr(a,val);break;
            case 9:a.push(val.itemType);bPutI32(a,val.items.length);for(const it of val.items)bPutVal(a,val.itemType,it);break;
            case 10:for(const t of val)bPutTag(a,t.type,t.name,t.value);a.push(0);break;
            case 11:bPutI32(a,val.length);for(const v of val)bPutI32(a,v);break;
        }
    }
    function bSerializeBE(root){
        const a=[];
        bPutTag(a,10,'',root);
        return new Uint8Array(a);
    }

    /* ========== .mcstructure 导出 ========== */
    const B_LAYER_W=8,B_LAYER_D=8,B_PER_LAYER=B_LAYER_W*B_LAYER_D;
    function bePosOf(idx){
        const layer=Math.floor(idx/B_PER_LAYER);
        const within=idx%B_PER_LAYER;
        const row=Math.floor(within/B_LAYER_W);
        const col=within%B_LAYER_W;
        const reverse=(layer%2===1);
        let z,x;
        if(!reverse){z=row;x=(row%2===0)?col:(B_LAYER_W-1-col);}
        else{z=B_LAYER_D-1-row;x=(row%2===0)?col:(B_LAYER_W-1-col);}
        return {x,y:layer,z};
    }
    function beFacingOf(a,b){
        if(b.y>a.y)return 'up';
        if(b.y<a.y)return 'down';
        if(b.x>a.x)return 'east';
        if(b.x<a.x)return 'west';
        if(b.z>a.z)return 'south';
        if(b.z<a.z)return 'north';
        return 'up';
    }
    function facingToBE(f){
        switch(f){
            case 'down':return 0;case 'up':return 1;case 'north':return 2;
            case 'south':return 3;case 'west':return 4;case 'east':return 5;
            default:return 1;
        }
    }

    function exportBEStructure(){
        const cmdEntries=[];
        const prefix=getLinePrefix();
        if(currentMode==='image'&&imageData){
            cmdEntries.push({type:'repeat',cmd:imageData.singleCmd,tickDelay:0});
        }else if(currentMode==='video'&&videoFrameData){
            const allCharArts=videoFrameData.allCharArts;
            let delay=parseInt(delayInput.value);
            if(isNaN(delay)||delay<1)delay=1;
            if(delay>20)delay=20;
            const mode=cmdModeSelect.value;
            cmdEntries.push({type:'pulse',cmd:'scoreboard players set f f 0',tickDelay:0});
            cmdEntries.push({type:'repeat',cmd:'scoreboard players add f f 1',tickDelay:delay-1});
            for(let i=0;i<allCharArts.length;i++){
                if(!allCharArts[i])continue;
                const singleCmd=buildSingleCommand(allCharArts[i],mode,prefix);
                cmdEntries.push({type:'chain',cmd:`execute if score f f matches ${i+1} run ${singleCmd}`,tickDelay:0});
            }
        }else{
            alert('请先转换图片或视频，再导出结构。');
            return;
        }
        if(cmdEntries.length===0){alert('没有可导出的命令方块。');return;}

        const total=cmdEntries.length;
        const layers=Math.ceil(total/B_PER_LAYER);
        const sizeX=B_LAYER_W,sizeY=layers,sizeZ=B_LAYER_D;
        const totalBlocks=sizeX*sizeY*sizeZ;
        const blockIndices=new Array(totalBlocks).fill(0);
        const blockPositionData=new Map();
        const palette=[];
        const paletteMap=new Map();
        function getPaletteIdx(name,states){
            const key=name+'|'+JSON.stringify(states);
            if(paletteMap.has(key))return paletteMap.get(key);
            palette.push({name,states,version:17959425});
            const i=palette.length-1;
            paletteMap.set(key,i);
            return i;
        }
        getPaletteIdx('minecraft:air',{});
        for(let i=0;i<total;i++){
            const p=bePosOf(i);
            const within=i%B_PER_LAYER;
            const isLastOfLayer=(within===B_PER_LAYER-1);
            let facingJava;
            if(isLastOfLayer)facingJava='up';
            else if(i===total-1)facingJava='east';
            else facingJava=beFacingOf(p,bePosOf(i+1));
            const facingDir=facingToBE(facingJava);
            const e=cmdEntries[i];
            let blockName;
            if(e.type==='pulse')blockName='minecraft:command_block';
            else if(e.type==='repeat')blockName='minecraft:repeating_command_block';
            else blockName='minecraft:chain_command_block';
            const auto=(e.type==='chain')?1:0;
            const tickDelay=e.tickDelay||0;
            const stateIdx=getPaletteIdx(blockName,{facing_direction:facingDir,conditional_bit:0});
            const flatIdx=p.x*sizeY*sizeZ+p.y*sizeZ+p.z;
            blockIndices[flatIdx]=stateIdx;
            blockPositionData.set(String(flatIdx),[
                {name:'block_entity_data',type:10,value:[
                    {name:'id',type:8,value:'CommandBlock'},
                    {name:'Command',type:8,value:e.cmd},
                    {name:'CustomName',type:8,value:''},
                    {name:'ExecuteOnFirstTick',type:1,value:0},
                    {name:'LPCommandMode',type:3,value:0},
                    {name:'LPCondionalMode',type:1,value:0},
                    {name:'LPRedstoneMode',type:1,value:0},
                    {name:'LastExecution',type:4,value:-1},
                    {name:'LastOutput',type:8,value:''},
                    {name:'LastOutputParams',type:9,value:{itemType:8,items:[]}},
                    {name:'SuccessCount',type:3,value:0},
                    {name:'TickDelay',type:3,value:tickDelay},
                    {name:'TrackOutput',type:1,value:1},
                    {name:'Version',type:3,value:34},
                    {name:'auto',type:1,value:auto},
                    {name:'conditionalMode',type:1,value:0},
                    {name:'conditionMet',type:1,value:0},
                    {name:'powered',type:1,value:0}
                ]}
            ]);
        }
        const paletteEntries=palette.map(e=>[
            {name:'name',type:8,value:e.name},
            {name:'states',type:10,value:Object.entries(e.states).map(([k,v])=>({
                name:k,type:Number.isInteger(v)?3:5,value:v
            }))},
            {name:'version',type:3,value:e.version}
        ]);
        const bpEntries=[];
        for(const [k,v] of blockPositionData)bpEntries.push({name:k,type:10,value:v});
        const structureTag=[
            {name:'block_indices',type:9,value:{itemType:9,items:[
                {itemType:3,items:blockIndices},
                {itemType:3,items:new Array(totalBlocks).fill(-1)}
            ]}},
            {name:'entities',type:9,value:{itemType:10,items:[]}},
            {name:'palette',type:10,value:[
                {name:'default',type:10,value:[
                    {name:'block_palette',type:9,value:{itemType:10,items:paletteEntries}},
                    {name:'block_position_data',type:10,value:bpEntries}
                ]}
            ]}
        ];
        const root=[
            {name:'format_version',type:3,value:1},
            {name:'size',type:9,value:{itemType:3,items:[sizeX,sizeY,sizeZ]}},
            {name:'structure',type:10,value:structureTag},
            {name:'structure_world_origin',type:9,value:{itemType:3,items:[0,0,0]}}
        ];
        const bytes=bSerializeBE(root);
        const blob=new Blob([bytes],{type:'application/octet-stream'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download=randomName()+'.mcstructure';
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setStatus('success',`结构导出成功！共 ${total} 个命令方块，尺寸 ${sizeX}×${sizeY}×${sizeZ}。`);
    }
    exportBEStructBtn.addEventListener('click',exportBEStructure);

    /* ========== .mcworld 存档导出 ========== */
    async function mcwDeflateRaw(data){
        if(typeof CompressionStream==='undefined')return null;
        try{
            const cs=new CompressionStream('deflate-raw');
            const writer=cs.writable.getWriter();
            writer.write(data);writer.close();
            const ab=await new Response(cs.readable).arrayBuffer();
            return new Uint8Array(ab);
        }catch(e){return null;}
    }

    class McwZipBuilder{
        constructor(){this.files=[];this.centralDir=[];this.offset=0;}
        async addFile(name,data,compress=false){
            const nameBytes=new TextEncoder().encode(name);
            const crc=this._crc32(data);
            const uncompSize=data.length;
            let storedData=data;let method=0;
            if(compress){
                const compressed=await mcwDeflateRaw(data);
                if(compressed&&compressed.length<data.length){storedData=compressed;method=8;}
            }
            const compSize=storedData.length;
            const local=new Uint8Array(30+nameBytes.length);
            const lv=new DataView(local.buffer);
            lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);
            lv.setUint16(8,method,true);lv.setUint16(10,0,true);lv.setUint16(12,0,true);
            lv.setUint32(14,crc,true);lv.setUint32(18,compSize,true);lv.setUint32(22,uncompSize,true);
            lv.setUint16(26,nameBytes.length,true);lv.setUint16(28,0,true);
            local.set(nameBytes,30);
            const localHeaderOffset=this.offset;
            this.files.push(local,storedData);
            this.offset+=local.length+compSize;
            const central=new Uint8Array(46+nameBytes.length);
            const cv=new DataView(central.buffer);
            cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
            cv.setUint16(8,0,true);cv.setUint16(10,method,true);cv.setUint16(12,0,true);
            cv.setUint16(14,0,true);cv.setUint32(16,crc,true);cv.setUint32(20,compSize,true);
            cv.setUint32(24,uncompSize,true);cv.setUint16(28,nameBytes.length,true);
            cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);
            cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,localHeaderOffset,true);
            central.set(nameBytes,46);
            this.centralDir.push(central);
        }
        _crc32(data){
            let crc=0xFFFFFFFF;
            for(let i=0;i<data.length;i++){
                crc^=data[i];
                for(let j=0;j<8;j++)crc=(crc>>>1)^(0xEDB88320&-(crc&1));
            }
            return (crc^0xFFFFFFFF)>>>0;
        }
        build(){
            const centralOffset=this.offset;
            let centralSize=0;
            for(const c of this.centralDir)centralSize+=c.length;
            const end=new Uint8Array(22);
            const ev=new DataView(end.buffer);
            ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
            ev.setUint16(8,this.centralDir.length,true);ev.setUint16(10,this.centralDir.length,true);
            ev.setUint32(12,centralSize,true);ev.setUint32(16,centralOffset,true);ev.setUint16(20,0,true);
            const parts=[...this.files,...this.centralDir,end];
            let total=0;
            for(const p of parts)total+=p.length;
            const out=new Uint8Array(total);
            let pos=0;
            for(const p of parts){out.set(p,pos);pos+=p.length;}
            return out;
        }
    }

    const MCW_CRC32C_TABLE=(()=>{
        const t=new Int32Array(256);
        for(let i=0;i<256;i++){
            let c=i;
            for(let j=0;j<8;j++)c=(c&1)?(0x82F63B78^(c>>>1)):(c>>>1);
            t[i]=c;
        }
        return t;
    })();
    function mcwCrc32c(data){
        let crc=0xFFFFFFFF;
        for(let i=0;i<data.length;i++)crc=MCW_CRC32C_TABLE[(crc^data[i])&0xFF]^(crc>>>8);
        return (crc^0xFFFFFFFF)>>>0;
    }
    function mcwMaskedCRC32C(data){
        const crc=mcwCrc32c(data);
        return (((crc>>>15)|(crc<<17))+0xa282ead8)>>>0;
    }
    function mcwWriteVarInt(buf,value){
        while(value>=0x80){buf.push((value&0x7F)|0x80);value>>>=7;}
        buf.push(value&0x7F);
    }
    function mcwPackBits(buf,index,value,bits){
        const totalBit=index*bits;
        let byteIdx=totalBit>>3,bitOff=totalBit&7;
        let remaining=bits,v=value;
        while(remaining>0){
            const bitsAvailable=8-bitOff;
            const bitsToWrite=Math.min(bitsAvailable,remaining);
            const mask=((1<<bitsToWrite)-1)<<bitOff;
            const bitsValue=(v&((1<<bitsToWrite)-1))<<bitOff;
            buf[byteIdx]=(buf[byteIdx]&~mask)|bitsValue;
            v>>>=bitsToWrite;remaining-=bitsToWrite;byteIdx++;bitOff=0;
        }
    }

    function mcwBuildSubChunk(paletteEntries,subChunkBlocks,subY){
        const pc=paletteEntries.length;
        let BITS;
        if(pc<=4)BITS=2;
        else if(pc<=16)BITS=4;
        else if(pc<=256)BITS=8;
        else throw new Error('SubChunk palette 太大: '+pc+' 项');
        const indexByteCount=(4096*BITS)>>3;
        const indexBytes=new Uint8Array(indexByteCount);
        for(const b of subChunkBlocks){
            const idx=b.x*256+b.z*16+b.y;
            mcwPackBits(indexBytes,idx,b.paletteIdx,BITS);
        }
        const buf=[];
        buf.push(9);buf.push(1);buf.push(subY&0xFF);buf.push((BITS<<1)|0);
        for(let i=0;i<indexBytes.length;i++)buf.push(indexBytes[i]);
        buf.push(pc&0xFF,(pc>>8)&0xFF,(pc>>16)&0xFF,(pc>>24)&0xFF);
        for(const entry of paletteEntries){for(let i=0;i<entry.length;i++)buf.push(entry[i]);}
        return {bytes:new Uint8Array(buf),bits:BITS,paletteSize:pc,indexBytes:indexByteCount};
    }
